services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: novel2
      POSTGRES_USER: novel2
      POSTGRES_PASSWORD: ${NOVEL2_DB_PASSWORD:-novel2-local}
    volumes:
      - novel2_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U novel2 -d novel2"]
      interval: 5s
      timeout: 3s
      retries: 20

  novel2-illustration-workbench:
    # Private sidecar, addressable only through the authenticated Novel2 proxy.
    build:
      context: ..
      dockerfile: illustration_pipeline/Dockerfile.workbench
    environment:
      NOVEL2_TELEGRAM_AUTH_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      NOVEL2_EDGE_AI_URL: ${NOVEL2_EDGE_AI_URL:-https://novel2-preview.kontrakevich.workers.dev/novel2-ai}
      WORKBENCH_DATA: /data
    command:
      - python
      - -c
      - |
        import os,sys,hashlib
        token=os.environ.get('NOVEL2_TELEGRAM_AUTH_TOKEN','')
        if not token: sys.exit('WORKBENCH_AUTH_UNCONFIGURED')
        os.environ['WORKBENCH_TOKEN']=hashlib.sha256(('novel2-ai-v1:'+token).encode()).hexdigest()
        os.execvp('python',['python','workbench.py','--host','0.0.0.0','--port','5691'])
    volumes:
      - novel2_workbench_data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5691/health',timeout=3).read()"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - default

  app:
    build: .
    env_file:
      - ../.env
      - .env
    environment:
      DATABASE_URL: postgresql://novel2:${NOVEL2_DB_PASSWORD:-novel2-local}@postgres:5432/novel2
      # Auth-only API: never advertise a polling-bot token to sibling deployers.
      NOVEL2_TELEGRAM_AUTH_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_BOT_TOKEN: ""
      BOT_TOKEN: ""
      PRIMARY_OWNER_ID: ${PRIMARY_OWNER_ID:-}
      PARTNER_TELEGRAM_ID: ${PARTNER_TELEGRAM_ID:-}
      NOVEL2_EDGE_AI_URL: ${NOVEL2_EDGE_AI_URL:-https://novel2-preview.kontrakevich.workers.dev/novel2-ai}
      NOVEL2_TEXT_MODEL: ${NOVEL2_TEXT_MODEL:-openai/gpt-5.6}
      NOVEL2_VISION_MODEL: ${NOVEL2_VISION_MODEL:-openai/gpt-5.6}
      NOVEL2_IMAGE_MODEL: ${NOVEL2_IMAGE_MODEL:-bytedance-seed/seedream-4.5}
      NOVEL2_PORT: 5690
      NOVEL2_LOCAL_TEST_MODE: ${NOVEL2_LOCAL_TEST_MODE:-0}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "5690:5690"
    restart: unless-stopped
    networks:
      - default
      - night_context

volumes:
  novel2_pg:
  novel2_workbench_data:


networks:
  night_context:
    external: true
    name: night_for_two_context

