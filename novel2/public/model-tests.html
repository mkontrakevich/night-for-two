<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Тестирование моделей · Novel 2.0</title><script src="https://telegram.org/js/telegram-web-app.js"></script><style>body{margin:0;background:#111010;color:#e8e2df;font:16px/1.5 system-ui}main{max-width:720px;margin:auto;padding:22px}h1{font:34px Georgia}section{border:1px solid #514c4b;padding:20px;margin:18px 0}button,a{font:inherit}button{background:transparent;color:inherit;border:1px solid #746a66;padding:12px;margin:8px 0;cursor:pointer}a{color:inherit}label{display:block;margin:10px 0}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:inherit}#message{min-height:1.5em}button:disabled{opacity:.5}</style></head><body><main>
<a href="/novel2/">← В роман</a><h1>Тестирование моделей</h1>
<section><h2>Загрузить файл-тест</h2><p>Файл .txt будет сохранён на Drive проекта. После запуска его содержимое получат выбранные модели через OpenRouter; запросы могут быть платными.</p><input id="file" type="file" accept=".txt,text/plain"><div id="models"></div><button id="upload" disabled>Загрузить файл</button><p id="message" role="status"></p></section>
<section><h2>Результаты тестов</h2><button id="reload">Обновить список</button><div id="jobs"></div><div id="details"></div></section>
<script>
'use strict';
const $=id=>document.getElementById(id), init=window.Telegram?.WebApp?.initData||sessionStorage.getItem('novel2_illustrations_init')||'';
let active=null,timer=null,busy=false;
async function api(action,data={}){const response=await fetch('/novel2/api/model-tests/'+action,{method:'POST',headers:{'content-type':'application/json','x-telegram-init-data':init},body:JSON.stringify(data),signal:AbortSignal.timeout(30000)});const result=await response.json();if(!response.ok||!result.ok)throw Error(result.error||'REQUEST_FAILED');return result}
function status(message){$('message').textContent=message}
function el(tag,text){const element=document.createElement(tag);element.textContent=text;return element}
function show(job){active=job;const d=$('details');d.replaceChildren(el('h3','Задание '+job.id.slice(0,8)),el('p','Состояние: '+job.state));
 if(job.state==='ready'){const start=el('button','Запустить сравнение');start.onclick=()=>act(async()=>{if(!confirm('Отправить файл выбранным моделям? Возможна оплата запросов.'))return;show((await api('start',{job_id:job.id,confirm:true})).job);watch()});d.append(start)}
 for(const result of job.results||[]){d.append(el('h4',result.model+' · '+result.status));if(result.content)d.append(el('pre',result.content));if(result.error)d.append(el('p',result.error))}
 if(job.export){d.append(el('p','Сохранение на Drive: '+job.export.state));if(job.export.state==='complete'&&/^https:\/\/drive\.google\.com\//.test(job.export.url||'')){const link=el('a','Открыть результат на Drive');link.href=job.export.url;link.target='_blank';link.rel='noopener noreferrer';d.append(link)}}
}
async function list(){const data=await api('list');$('jobs').replaceChildren();for(const job of data.jobs){const button=el('button',job.id.slice(0,8)+' · '+job.state);button.onclick=()=>act(async()=>{const selected=(await api('status',{job_id:job.id})).job;show(selected);if(['queued','running','ready_to_export','exporting'].includes(selected.state))watch()});$('jobs').append(button)}}
async function act(fn){if(busy)return;busy=true;try{await fn()}catch(e){status('Не удалось выполнить действие: '+String(e.message||'ошибка'))}finally{busy=false}}
function watch(){clearInterval(timer);timer=setInterval(async()=>{if(!active)return;try{const job=(await api('status',{job_id:active.id})).job;show(job);if(['complete','uncertain','source_uncertain','export_uncertain','failed'].includes(job.state)){clearInterval(timer);await list()}}catch{clearInterval(timer);status('Не удалось получить статус. Обновите список; повторный запрос не запускался.')}},2500)}
$('upload').onclick=()=>act(async()=>{const file=$('file').files[0],selected=[...document.querySelectorAll('input[name=model]:checked')].map(x=>x.value);if(!file||!selected.length)throw Error('выберите файл и модели');if(file.size>64000)throw Error('максимальный размер файла — 64 КБ');const bytes=new Uint8Array(await file.arrayBuffer());let binary='';for(const byte of bytes)binary+=String.fromCharCode(byte);status('Сохраняем файл на Drive…');const data=await api('upload',{filename:file.name,data:btoa(binary),models:selected});status(data.job.state==='ready'?'Файл сохранён. Теперь можно запустить сравнение.':'Не удалось подтвердить сохранение файла. Проверьте Drive перед повторной загрузкой.');show(data.job);await list()});
$('reload').onclick=()=>act(list);
act(async()=>{const {models}=await api('config');for(const model of models){const label=el('label',''),box=document.createElement('input');box.type='checkbox';box.name='model';box.value=model;label.append(box,document.createTextNode(' '+model));$('models').append(label)}$('upload').disabled=false;await list()});
</script></main></body></html>
