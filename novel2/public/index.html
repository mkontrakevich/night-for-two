<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0b0909">
<title>Interactive Novel 2.0</title>
<script src="https://telegram.org/js/telegram-web-app.js?63"></script>
<style>
:root{--paper:#f1e8d8;--ink:#231d18;--muted:#8e8174;--red:#8e2833;--line:rgba(36,29,24,.16);--safe:env(safe-area-inset-bottom)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#000;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",sans-serif}button,textarea,input{font:inherit}
#app{max-width:720px;margin:auto;min-height:100dvh;background:var(--paper);color:var(--ink)}
.cover{min-height:100dvh;padding:10vh 22px calc(28px + var(--safe));display:flex;flex-direction:column;background:radial-gradient(circle at 72% 8%,#553031,transparent 33%),linear-gradient(160deg,#1b1614,#070707 62%);color:#fff}
.kicker{font-size:10px;letter-spacing:.18em;text-transform:uppercase;opacity:.58}.cover h1,.calibration h1{font:400 clamp(40px,12vw,68px)/.94 Georgia,serif;letter-spacing:-.045em;margin:16px 0}.cover>p{max-width:560px;font:400 17px/1.55 Georgia,serif;color:#d7cdc4}
.actions{margin-top:auto;display:grid;gap:9px}.primary,.secondary{border:0;border-radius:18px;min-height:54px;padding:14px 18px}.primary{background:#fff;color:#17120f;font-weight:700}.secondary{background:rgba(255,255,255,.08);color:#fff;border:1px solid rgba(255,255,255,.16)}button:disabled{opacity:.4}
.builder{margin:24px 0 18px;padding:18px;border:1px solid rgba(255,255,255,.15);border-radius:22px;background:rgba(255,255,255,.055);backdrop-filter:blur(10px)}.builder h2{font:500 22px/1.15 Georgia,serif;margin:0 0 8px}.builder p{font-size:13px;line-height:1.48;color:#cfc4bc;margin:0 0 13px}.field{display:grid;gap:6px;margin:12px 0}.field label{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#a99b92}.field input[type=text],.field textarea{width:100%;border:1px solid rgba(255,255,255,.14);background:rgba(0,0,0,.22);color:#fff;border-radius:14px;padding:12px 13px;outline:none}.field textarea{min-height:82px;resize:vertical}.field input[type=file]{width:100%;color:#ddd}.hint{font-size:11px;color:#9f9188;line-height:1.4}
.pairState{display:flex;gap:8px;margin:10px 0 18px;flex-wrap:wrap}.pairState span{font-size:11px;padding:7px 9px;border-radius:999px;background:rgba(255,255,255,.08)}
.readyCard{margin:22px 0;padding:18px;border:1px solid rgba(255,255,255,.15);border-radius:22px;background:rgba(255,255,255,.055)}.readyCard h3{font:500 25px/1.1 Georgia,serif;margin:0 0 5px}.readyCard .meta{font-size:12px;color:#b9aaa1;margin-bottom:9px}.readyCard p{font:400 14px/1.5 Georgia,serif;color:#d9cdc5;margin:0}
.mainMenu{min-height:100dvh;padding:8vh 22px calc(30px + var(--safe));background:radial-gradient(circle at 72% 8%,#553031,transparent 33%),linear-gradient(160deg,#1b1614,#070707 62%);color:#fff}.mainMenu h1{font:400 clamp(42px,12vw,68px)/.94 Georgia,serif;letter-spacing:-.045em;margin:16px 0 10px}.mainMenu>p{font:400 16px/1.52 Georgia,serif;color:#d7cdc4}.menuCard{margin:18px 0;padding:18px;border:1px solid rgba(255,255,255,.14);border-radius:22px;background:rgba(255,255,255,.055)}.menuCard h2{font:500 25px/1.1 Georgia,serif;margin:0 0 6px}.menuCard .meta{font-size:11px;color:#a99b92}.menuActions{display:grid;gap:9px;margin:18px 0}.libraryTitle{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#9f9188;margin:26px 0 9px}.libraryBook{padding:14px 0;border-top:1px solid rgba(255,255,255,.12)}.libraryBook strong{display:block;font:500 15px/1.3 Georgia,serif}.libraryBook span{font-size:11px;color:#9f9188}.danger{border:1px solid rgba(255,125,125,.28);color:#f0d4d4}.novelEdit{display:grid;grid-template-columns:1fr auto;gap:8px;margin:8px 0}.novelEdit input{min-width:0;border:1px solid rgba(255,255,255,.14);background:rgba(0,0,0,.22);color:#fff;border-radius:12px;padding:9px 10px}.miniActions{display:flex;gap:7px;flex-wrap:wrap}.miniBtn{border:1px solid rgba(255,255,255,.15);background:rgba(255,255,255,.06);color:#fff;border-radius:999px;padding:7px 10px;font-size:11px}.storySetup{min-height:100dvh;padding:7vh 20px calc(28px + var(--safe));background:linear-gradient(160deg,#171210,#080706 72%);color:#fff}.storySetup h1{font:400 clamp(38px,11vw,60px)/.96 Georgia,serif;letter-spacing:-.04em;margin:14px 0}.storySetup>p{font:400 16px/1.5 Georgia,serif;color:#d7cdc4}.castSlot{margin:12px 0;padding:15px;border:1px solid rgba(255,255,255,.13);border-radius:18px;background:rgba(255,255,255,.05)}.castSlot strong{display:block;font:500 16px/1.25 Georgia,serif}.castSlot p{margin:6px 0 10px;font-size:12px;line-height:1.42;color:#bcaea5}.castSlot select{width:100%;border:1px solid rgba(255,255,255,.14);background:#171311;color:#fff;border-radius:12px;padding:11px}.storyMeta{font-size:12px;color:#a99b92;margin-bottom:20px}
.playerCards{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0 18px}.playerCard{min-width:0;padding:10px;border:1px solid rgba(255,255,255,.13);border-radius:18px;background:rgba(255,255,255,.05);display:grid;grid-template-columns:54px 1fr;gap:10px;align-items:center}.playerAvatar,.castAvatar{width:54px;height:54px;border-radius:16px;object-fit:cover;background:#241d19;border:1px solid rgba(255,255,255,.12)}.avatarFallback{width:54px;height:54px;border-radius:16px;background:linear-gradient(145deg,#4e3332,#171210);display:grid;place-items:center;font:600 18px Georgia,serif;color:#eadfd7;border:1px solid rgba(255,255,255,.12)}.playerCard b{display:block;font:500 14px/1.2 Georgia,serif}.playerCard small{display:block;margin-top:4px;color:#9f9188;font-size:10px;line-height:1.3}.castPreview{display:grid;grid-template-columns:54px 1fr;gap:10px;align-items:center;margin:11px 0 0;padding-top:11px;border-top:1px solid rgba(255,255,255,.1)}.castPreview b{display:block;font:500 14px/1.2 Georgia,serif}.castPreview small{display:block;margin-top:4px;color:#a99b92;font-size:10px;line-height:1.35}
.calibration{min-height:100dvh;padding:24px 20px calc(30px + var(--safe));background:linear-gradient(160deg,#161210,#080706 70%);color:#fff}.calibration h1{font-size:42px}.calibration>p{font:400 15px/1.55 Georgia,serif;color:#cfc2ba}.calibration img{display:block;width:100%;border-radius:22px;margin:18px 0;max-height:62vh;object-fit:contain;background:#181310}.cardPreview{padding:18px;border:1px solid rgba(255,255,255,.14);border-radius:20px;background:rgba(255,255,255,.05);margin:0 0 18px}.cardPreview h2{font:500 28px/1.05 Georgia,serif;margin:0 0 5px}.cardPreview .meta{color:#a99c94;font-size:12px;margin-bottom:12px}.cardPreview p{font:400 15px/1.52 Georgia,serif;color:#ddd1c8}.cardPreview dl{margin:12px 0 0;display:grid;grid-template-columns:110px 1fr;gap:7px 10px;font-size:12px}.cardPreview dt{color:#8f8178}.cardPreview dd{margin:0;color:#e3d9d1}
.reader{min-height:100dvh;padding-bottom:190px}.chrome{position:sticky;top:0;z-index:5;padding:16px 18px 13px;background:linear-gradient(var(--paper) 78%,rgba(241,232,216,.9));border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:14px}.bookTitle{font:600 12px/1.3 Georgia,serif}.chapter{font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:var(--muted)}.exitStory{border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:999px;padding:7px 11px;font-size:11px;white-space:nowrap}
.sceneImage{display:none;width:100%;aspect-ratio:9/16;object-fit:cover}.sceneImage.on{display:block}.prose{padding:34px 24px 24px;font:400 20px/1.72 Georgia,serif;white-space:pre-wrap}.turnPrompt{margin:8px 24px 0;padding:20px 0;border-top:1px solid var(--line);font:600 17px/1.45 Georgia,serif}
.replyDock{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(720px,100%);padding:10px 14px calc(12px + var(--safe));background:linear-gradient(rgba(241,232,216,.2),var(--paper) 16%);backdrop-filter:blur(12px);border-top:1px solid var(--line)}.replyDock textarea{width:100%;min-height:72px;max-height:150px;resize:none;border:1px solid var(--line);background:#fffaf1;border-radius:18px;padding:13px 14px;color:var(--ink);outline:none}.replyRow{display:grid;grid-template-columns:1fr auto;gap:9px;margin-top:8px}.send{border:0;border-radius:16px;background:var(--red);color:white;padding:0 20px;font-weight:700;min-height:48px}.status{padding:10px 24px 28px;color:var(--muted);font-size:13px}.choiceRow{display:flex;gap:8px;overflow:auto;padding:0 24px 8px}.chip{border:1px solid var(--line);background:#fff9ef;color:var(--ink);border-radius:999px;padding:9px 12px;white-space:nowrap}
.loading{min-height:100dvh;display:grid;place-items:center;padding:30px;background:#14110f;color:#e9dfd6;text-align:center}.loading i{display:block;width:34px;height:34px;margin:0 auto 16px;border:2px solid #554943;border-top-color:#eee1d3;border-radius:50%;animation:r 1s linear infinite}@keyframes r{to{transform:rotate(360deg)}}

.editorialHero{position:relative;min-height:68vh;margin:-20px -18px 26px;padding:34px 22px 28px;display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden;border-bottom:1px solid rgba(255,255,255,.18);background:radial-gradient(circle at 78% 42%,rgba(116,20,34,.5),transparent 34%),linear-gradient(118deg,#080808 0%,#10090a 48%,#2a0c12 100%)}
.editorialHero:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.18),transparent 58%,rgba(0,0,0,.16));pointer-events:none}
.editorialCopy{position:relative;z-index:1;max-width:620px}.editorialCopy h1{font-family:Georgia,"Times New Roman",serif;font-weight:400;font-size:clamp(48px,11vw,92px);line-height:.88;letter-spacing:-.045em;margin:18px 0 20px}.editorialCopy p{max-width:480px;color:#c9c1be;font-size:15px;line-height:1.55}
.editorialObjects{position:absolute;right:-5%;bottom:5%;width:58%;height:64%;opacity:.94;background:radial-gradient(ellipse at 58% 68%,#7e1726 0 14%,transparent 15%),radial-gradient(ellipse at 72% 55%,#171313 0 17%,transparent 18%),linear-gradient(155deg,transparent 35%,rgba(255,255,255,.08) 36%,transparent 38%);filter:contrast(1.1)}
.editorialObjects:before{content:"MASK · SILK · LEATHER";position:absolute;right:9%;bottom:8%;font-size:10px;letter-spacing:.28em;color:rgba(255,255,255,.52);writing-mode:vertical-rl}
.editorialCTA{margin-top:8px;width:max-content;border:1px solid rgba(255,255,255,.72)!important;background:transparent!important;border-radius:0!important;padding:15px 28px!important;letter-spacing:.14em;text-transform:uppercase}
.editorialRail{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:rgba(255,255,255,.16);margin:0 0 30px}.editorialTile{min-height:132px;padding:18px;background:#111;display:flex;flex-direction:column;justify-content:flex-end}.editorialTile b{font-size:13px;letter-spacing:.12em;text-transform:uppercase}.editorialTile small{color:#8e8581;margin-top:6px}
.mainMenu{max-width:none!important}.mainMenu>.kicker,.mainMenu>h1,.mainMenu>p{display:none}.mainMenu .libraryTitle{margin-top:34px}
@media(max-width:640px){.editorialHero{min-height:61vh;margin:-16px -14px 22px}.editorialObjects{width:72%;opacity:.6}.editorialRail{grid-template-columns:1fr 1fr}.editorialTile:last-child{grid-column:1/-1}.editorialCopy h1{font-size:54px}.editorialCopy p{max-width:78%}}
</style>
</head>
<body><main id="app"></main>
<script>
const app=document.getElementById('app');
const tg=window.Telegram?.WebApp;try{tg?.ready();tg?.expand()}catch{}
let state=null,busy=false,selectedAction='',calibrationImage='',characterDraft=null,forceBuilder=false,menuMode=false,libraryBooks=[],libraryDrafts=[],storyDraft=null,aiCharacters=[],roleGenderHints={A:'',B:''};

function telegramInitData(){
 const sdk=String(window.Telegram?.WebApp?.initData||'');
 if(sdk)return sdk;
 for(const raw of [location.search,location.hash]){
   const q=String(raw||'').replace(/^[?#]/,'');
   if(!q)continue;
   const value=new URLSearchParams(q).get('tgWebAppData');
   if(value)return String(value);
 }
 return '';
}
function authHeaders(){
 const h={},data=telegramInitData();
 if(data)h['x-telegram-init-data']=data;
 if(location.hostname==='localhost')h['x-novel2-local-user']=localStorage.getItem('novel2_local_user')||'local_a';
 return h;
}
async function api(path,body={}){
 const r=await fetch('/novel2/api/'+path,{method:'POST',headers:{'content-type':'application/json',...authHeaders()},body:JSON.stringify(body)});
 const j=await r.json();if(!r.ok||!j.ok)throw new Error(j.error||'REQUEST_FAILED');return j;
}
function esc(v=''){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function loading(text='Продолжаем историю…'){app.innerHTML='<section class="loading"><div><i></i><div>'+esc(text)+'</div></div></section>'}
function askConfirm(message){
 if(tg?.showConfirm)return new Promise(resolve=>tg.showConfirm(String(message),ok=>resolve(Boolean(ok))));
 return Promise.resolve(window.confirm(String(message)));
}
function avatarHtml(src='',name='',className='playerAvatar'){
 const safe=String(src||'');
 if(safe)return '<img class="'+className+'" src="'+esc(safe)+'" alt="'+esc(name||'Персонаж')+'">';
 const initials=String(name||'?').trim().split(/\s+/).slice(0,2).map(x=>x[0]||'').join('').toUpperCase()||'?';
 return '<div class="avatarFallback" aria-hidden="true">'+esc(initials)+'</div>';
}
async function refresh(){
 loading('Открываем роман…');
 try{state=(await api('state')).state;render()}
 catch(e){const missing=e.message==='NOVEL2_ACCESS_DENIED'&&!telegramInitData();app.innerHTML='<section class="loading"><div>'+esc(missing?'Telegram не передал данные входа. Закройте окно и откройте 18+ ещё раз.':e.message)+'</div></section>'}
}
function characterCardHtml(card){
 const p=card?.passport||{},psy=card?.psychology||{},rom=card?.romance||{},base=card?.behavioral_baseline||{};
 const source=base.relationship_grounded?'Основа характера · реальный стиль общения пары':'Основа характера · художественная модель';
 return '<div class="cardPreview"><div class="kicker">CHARACTER CARD</div><h2>'+esc(p.fiction_name||'Ваш персонаж')+'</h2><div class="meta">'+esc((p.age?p.age+' · ':'')+(p.archetype||p.story_role||''))+'</div><div class="hint">'+esc(source)+'</div><p>'+esc(card?.literary_portrait||p.story_hook||'')+'</p><dl><dt>Роль</dt><dd>'+esc(p.story_role||'—')+'</dd><dt>Характер</dt><dd>'+esc(psy.temperament||'—')+'</dd><dt>Стиль общения</dt><dd>'+esc(base.communication_style||psy.speech_style||'—')+'</dd><dt>Инициатива</dt><dd>'+esc(base.initiative_pattern||'—')+'</dd><dt>Динамика</dt><dd>'+esc(rom.dynamic||'—')+'</dd><dt>Крючок</dt><dd>'+esc(p.story_hook||'—')+'</dd></dl></div>';
}
async function loadAiCharacters(){
 try{
   const j=await api('ai-characters');
   aiCharacters=Array.isArray(j.characters)?j.characters:[];
   roleGenderHints=j.role_gender_hints&&typeof j.role_gender_hints==='object'?j.role_gender_hints:{A:'',B:''};
 }catch{}
}
async function loadLibrary(){
 try{
   const j=await api('books');
   libraryBooks=Array.isArray(j.books)?j.books:[];
   libraryDrafts=Array.isArray(j.drafts)?j.drafts:[];
   if(menuMode)renderMainMenu();
 }catch{}
}
function bookRowHtml(x){
 const status=x.status==='active'?'Текущий':'Архив';
 return '<div class="libraryBook" data-book="'+esc(x.id)+'"><span>'+status+' · глава '+esc(x.chapter_no||1)+' · ход '+esc(x.turn_no||0)+'</span><div class="novelEdit"><input id="title-'+esc(x.id)+'" value="'+esc(x.title||'Без названия')+'" maxlength="140"><button class="miniBtn" data-save-title="'+esc(x.id)+'">Сохранить</button></div><div class="hint">'+esc(x.logline||'')+'</div><div class="miniActions">'+(x.status==='active'?'<button class="miniBtn" data-continue="'+esc(x.id)+'">Продолжить</button><button class="miniBtn" data-archive="'+esc(x.id)+'">В архив</button>':'<button class="miniBtn" data-open="'+esc(x.id)+'">Открыть</button>')+'<button class="miniBtn danger" data-delete="'+esc(x.id)+'">Удалить</button></div></div>';
}
function draftRowHtml(x){
 return '<div class="libraryBook"><span>Черновик истории</span><strong>'+esc(x.title||'Новая история')+'</strong><div class="hint">'+esc(x.logline||'')+'</div><div class="miniActions"><button class="miniBtn" data-draft="'+esc(x.id)+'">Выбрать персонажей</button><button class="miniBtn danger" data-delete-draft="'+esc(x.id)+'">Удалить</button></div></div>';
}
function bindMainMenu(){
 if(document.getElementById('continueBook'))document.getElementById('continueBook').onclick=()=>{menuMode=false;render()};
 if(document.getElementById('newBook'))document.getElementById('newBook').onclick=startNewBook;
 if(document.getElementById('editCharacter'))document.getElementById('editCharacter').onclick=editCharacterFromMenu;
 document.querySelectorAll('[data-save-title]').forEach(el=>el.onclick=()=>saveBookTitle(el.dataset.saveTitle));
 document.querySelectorAll('[data-continue]').forEach(el=>el.onclick=()=>{menuMode=false;render()});
 document.querySelectorAll('[data-open]').forEach(el=>el.onclick=()=>openBook(el.dataset.open));
 document.querySelectorAll('[data-archive]').forEach(el=>el.onclick=()=>archiveBookFromList(el.dataset.archive));
 document.querySelectorAll('[data-delete]').forEach(el=>el.onclick=()=>deleteBookFromList(el.dataset.delete));
 document.querySelectorAll('[data-delete-draft]').forEach(el=>el.onclick=()=>deleteDraftFromList(el.dataset.deleteDraft));
 document.querySelectorAll('[data-draft]').forEach(el=>el.onclick=()=>openStoryDraft(el.dataset.draft));
}
function roleCardHtml(role,character={}){
 const name=String(character?.name||'Персонаж не выбран');
 const extra=character?.source_type==='ai_library'?'готовый персонаж':character?.synthetic?'временный AI-персонаж':character?.ready===false?'не создан':'ваш персонаж';
 return '<div class="playerCard">'+avatarHtml(character?.avatar||'',name)+'<div><small>Игрок '+esc(role)+' · '+esc(extra)+'</small><b>'+esc(name)+'</b><small>'+esc(character?.story_role||character?.archetype||'')+'</small></div></div>';
}
function renderMainMenu(){
 const active=state?.mode==='reader'&&state?.book;
 const cast=Array.isArray(state?.cast)?state.cast:[];
 const activeRole=role=>cast.find(x=>String(x?.interactive_role||'')===role)||null;
 const a=active?(activeRole('A')||state?.characters?.A||{}):(state?.characters?.A||{});
 const b=active?(activeRole('B')||state?.characters?.B||{}):(state?.characters?.B||{});
 const mine=state?.characters?.[state?.role||'A']||{};
 const booksHtml=libraryBooks.length?libraryBooks.map(bookRowHtml).join(''):'<div class="hint">Готовых романов пока нет.</div>';
 const draftsHtml=libraryDrafts.length?libraryDrafts.map(draftRowHtml).join(''):'';
 app.innerHTML='<section class="mainMenu"><div class="editorialHero"><div class="editorialObjects"></div><div class="editorialCopy"><div class="kicker">INTERACTIVE NOVEL 2.0 · PRIVATE STORIES</div><h1>Фантазии<br>становятся<br>историями</h1><p>Интерактивные романы для двоих. Персонажи, атмосфера и выборы складываются в вашу собственную историю.</p><button class="editorialCTA" id="heroNewBook">Начать роман →</button></div></div><div class="editorialRail"><div class="editorialTile"><b>Ролевые сценарии</b><small>Новые грани истории</small></div><div class="editorialTile"><b>Аксессуары</b><small>Editorial-вдохновение</small></div><div class="editorialTile"><b>Атмосфера</b><small>Настроение сцены</small></div></div><div class="playerCards">'+roleCardHtml('A',a)+roleCardHtml('B',b)+'</div><div class="menuActions">'+(active?'<button class="primary" id="continueBook">Продолжить текущий роман</button>':'')+'<button class="'+(active?'secondary':'primary')+'" id="newBook">Создать новую историю</button>'+(!active?'<button class="secondary" id="editCharacter">'+(mine.ready?'Изменить моего персонажа':'Создать моего персонажа')+'</button>':'')+'</div>'+(draftsHtml?'<div class="libraryTitle">Черновики историй</div>'+draftsHtml:'')+'<div class="libraryTitle">Мои романы</div>'+booksHtml+'</section>';
 bindMainMenu();
 const heroNewBook=document.getElementById('heroNewBook');if(heroNewBook)heroNewBook.onclick=startNewBook;
}
async function openMainMenu(){
 storyDraft=null;menuMode=true;
 renderMainMenu();
 await Promise.all([loadLibrary(),loadAiCharacters()]);
}
async function saveBookTitle(id){
 const input=document.getElementById('title-'+id),title=String(input?.value||'').trim();if(!title)return;
 try{
   const j=await api('book/rename',{book_id:id,title});
   if(state?.book&&String(state.book.id)===String(id))state.book.title=j.book.title;
   await loadLibrary();
 }catch(e){alert(e.message)}
}
async function openBook(id){
 if(busy)return;busy=true;loading('Открываем роман…');
 try{state=(await api('book/open',{book_id:id})).state;menuMode=false;storyDraft=null;render()}
 catch(e){alert(e.message);await refresh()}finally{busy=false}
}
async function archiveBookFromList(id){
 if(!state?.book||String(state.book.id)!==String(id))return;
 if(!await askConfirm('Убрать текущий роман в архив?'))return;
 await exitStory(false);
}
async function deleteBookFromList(id){
 if(busy)return;
 if(!await askConfirm('Удалить этот роман окончательно? Это действие нельзя отменить.'))return;
 busy=true;
 try{
   const j=await api('book/delete',{book_id:id});
   state=j.state||state;
   menuMode=true;
   await loadLibrary();
   renderMainMenu();
 }catch(e){alert(e.message)}finally{busy=false}
}
async function deleteDraftFromList(id){
 if(busy)return;

function genderLabel(value=''){
 return ({female:'женщина',male:'мужчина',nonbinary:'небинарный персонаж'})[String(value)]||'гендер не указан';
}
function aiOptions(selected='',preferredGender=''){
 const list=[...aiCharacters].sort((a,b)=>{
   const ap=preferredGender&&a.gender===preferredGender?0:1,bp=preferredGender&&b.gender===preferredGender?0:1;
   return ap-bp||String(a.name).localeCompare(String(b.name),'ru');
 });
 return list.map(x=>'<option value="ai:'+esc(x.id)+'" '+(selected==='ai:'+x.id?'selected':'')+'>'+esc(x.name)+' · '+esc(genderLabel(x.gender))+' · '+esc((x.tags||[]).slice(0,2).join(', '))+'</option>').join('');
}
function defaultAi(index=0,preferredGender=''){
 const preferred=preferredGender?aiCharacters.filter(x=>x.gender===preferredGender):[];
 const pool=preferred.length?preferred:aiCharacters;
 return pool[index%Math.max(1,pool.length)]?.id||'';
}
async function loadAiAvatar(id){
 const ai=aiCharacters.find(x=>String(x.id)===String(id));
 if(!ai)return'';
 if(ai.avatar)return ai.avatar;
 try{
   const j=await api('ai-character/avatar',{id});
   ai.avatar=String(j.image||'');
   return ai.avatar;
 }catch{return''}
}
function castPreviewHtml(role,name='',gender='',avatar='',note=''){
 return '<div class="castPreview">'+avatarHtml(avatar,name,'castAvatar')+'<div><small>Игрок '+esc(role)+' будет играть этим персонажем</small><b>'+esc(name||'Персонаж')+'</b><small>'+esc([gender?genderLabel(gender):'',note].filter(Boolean).join(' · '))+'</small></div></div>';

async function refreshCastPreview(select){
 const role=String(select?.dataset?.runtimeRole||'');
 const target=document.getElementById(String(select?.dataset?.previewId||''));
 if(!role||!target)return;
 const token=String(select.value||'');
 if(token.startsWith('player:')){
   const summary=state?.characters?.[role]||{};
   target.innerHTML=castPreviewHtml(role,summary.name||('Игрок '+role),summary.gender||'',summary.avatar||'',summary.synthetic?'временный герой':'свой персонаж');
   return;
 }
 if(token.startsWith('ai:')){
   const id=token.slice(3),ai=aiCharacters.find(x=>String(x.id)===id);
   if(!ai){target.innerHTML='';return}
   target.innerHTML=castPreviewHtml(role,ai.name||'Готовый герой',ai.gender||'',ai.avatar||'','готовый герой библиотеки');
   if(!ai.avatar){
     const avatar=await loadAiAvatar(id);
     if(String(select.value||'')===token)target.innerHTML=castPreviewHtml(role,ai.name||'Готовый герой',ai.gender||'',avatar,'готовый герой библиотеки');
   }
 }
}

 });

async function launchStoryDraft(){
 if(busy||!storyDraft)return;
 const assignments={};
 document.querySelectorAll('[data-cast-slot]').forEach(el=>assignments[el.dataset.castSlot]=el.value);
 if(state?.mode==='reader'&&!await askConfirm('Начать новый роман? Текущий роман будет сохранён в архиве.'))return;
 busy=true;loading('Помещаем выбранных персонажей в готовую историю…');
 try{
   const j=await api('story/draft/launch',{draft_id:storyDraft.id,assignments});
   state=j.state;storyDraft=null;menuMode=false;libraryBooks=[];libraryDrafts=[];render();
 }catch(e){alert(e.message);renderStoryDraft()}finally{busy=false}
}

   const draftHtml='<div class="builder"><h2>Карточка уже сохранена</h2><p>Анализ фотографий завершён. Осталось построить калибровочный образ и подтвердить внешность. Если генерация изображения прервётся, повторный анализ фотографий не потребуется.</p>'+characterCardHtml(card)+'<div class="actions"><button class="primary" id="continueCalibration">Продолжить калибровку</button><button class="secondary" id="showBuilder">Загрузить другие фото</button></div></div>';
   const setup=forceBuilder
     ? builderHtml
     : mine
       ? '<div class="readyCard"><div class="kicker">ВАШ ГЕРОЙ</div><h3>'+esc(card?.passport?.fiction_name||'Персонаж зафиксирован')+'</h3><div class="meta">'+esc(card?.passport?.archetype||card?.passport?.story_role||'Visual Identity сохранён')+'</div><p>'+esc(card?.passport?.story_hook||card?.literary_portrait||'Карточка персонажа и визуальная идентичность готовы к роману.')+'</p></div>'
       : (hasDraft?draftHtml:builderHtml);
   const otherAi=Boolean(otherSummary.ready&&otherSummary.synthetic);
   const partnerAction=!otherSummary.ready
     ? '<button class="secondary" id="buildRandomCharacter">Второй игрок пока не подключился — создать AI-персонажа</button>'
     : otherAi
       ? '<button class="secondary" id="buildRandomCharacter">Пересоздать временного AI-персонажа</button>'

   const tag=x=>x?.ready?esc((x.name||'готов')+(x.synthetic?' · AI':'')):'не готов';
   app.innerHTML='<section class="cover"><div class="kicker">Interactive Novel 2.0</div><h1>Роман начинается с героя</h1><p>Роман может стартовать вдвоём или с временным AI-персонажем. Для реальных участников характер опирается на их наблюдаемый стиль общения в паре. У временного героя внешность случайная, но если профиль отсутствующего участника уже накоплен, его манера общения сохраняется.</p>'+setup+'<div class="pairState"><span>Герой A · '+tag(state?.characters?.A)+'</span><span>Герой B · '+tag(state?.characters?.B)+'</span></div><div class="actions">'+(both?'<button class="primary" id="start">Начать роман с этими героями</button>':'')+partnerAction+(!both&&!partnerAction?'<button class="secondary" disabled>Роман откроется после второго персонажа</button>':'')+'</div></section>';
   if(document.getElementById('start'))document.getElementById('start').onclick=start;

   if(document.getElementById('showBuilder'))document.getElementById('showBuilder').onclick=()=>{forceBuilder=true;render()};
   if(document.getElementById('buildRandomCharacter'))document.getElementById('buildRandomCharacter').onclick=buildRandomCharacter;
   return;
 }
 const s=state.scene||{},actions=(s.optional_actions||[]).map(x=>'<button class="chip" data-action="'+esc(x.key)+'">'+esc(x.label)+'</button>').join('');

 app.innerHTML='<section class="reader"><div class="chrome"><div><div class="bookTitle">'+esc(state.book?.title||'Роман')+'</div><div class="chapter">Глава '+esc(s.chapter_no||state.book?.chapter_no||1)+'</div></div><button class="exitStory" id="mainMenu">Меню</button></div><img id="sceneImage" class="sceneImage" alt=""><article class="prose">'+esc(s.prose||'')+'</article><div class="turnPrompt">'+esc(s.primary_interaction?.prompt||'Что вы отвечаете?')+'</div>'+(actions?'<div class="choiceRow">'+actions+'</div>':'')+'<div class="status">'+(state.can_reply?'Ваш ход · отвечайте от лица своего героя':waitingText)+'</div></section><div class="replyDock"><textarea id="reply" placeholder="'+(state.can_reply?'Ответить от лица героя…':'AI-персонаж отвечает автоматически')+'" '+(state.can_reply?'':'disabled')+'></textarea><div class="replyRow"><div id="selected"></div><button class="send" id="send" '+(state.can_reply?'':'disabled')+'>Ответить</button></div></div>';
 document.querySelectorAll('[data-action]').forEach(x=>x.onclick=()=>{selectedAction=x.dataset.action;document.getElementById('selected').textContent='Выбрано: '+x.textContent});
 document.getElementById('send').onclick=sendReply;

 void loadVisual();

async function rawDataUrl(file){
 return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(String(r.result||''));r.onerror=reject;r.readAsDataURL(file)});
}
async function fileToReference(file){
 const fallback=()=>rawDataUrl(file);
 try{
   const src=URL.createObjectURL(file),img=new Image();
   await new Promise((resolve,reject)=>{img.onload=resolve;img.onerror=reject;img.src=src});
   const max=1800,scale=Math.min(1,max/Math.max(img.naturalWidth||1,img.naturalHeight||1));
   const canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(img.naturalWidth*scale));canvas.height=Math.max(1,Math.round(img.naturalHeight*scale));
   const ctx=canvas.getContext('2d',{alpha:false});ctx.drawImage(img,0,0,canvas.width,canvas.height);URL.revokeObjectURL(src);
   return canvas.toDataURL('image/jpeg',.84);
 }catch{return fallback()}
}
async function filesToDataUrls(files){
 const out=[];for(const file of [...files].slice(0,6))out.push(await fileToReference(file));return out;
}
async function buildCharacter(){
 if(busy)return;
 const input=document.getElementById('characterFiles'),files=input?.files;
 if(!files||files.length<1){alert('Загрузите хотя бы одну фотографию.');return}
 const preferredName=String(document.getElementById('characterName')?.value||'').trim();
 const creatorNote=String(document.getElementById('characterNote')?.value||'').trim();
 busy=true;loading('Анализируем фотографии и собираем карточку персонажа…');
 try{
   const refs=await filesToDataUrls(files);
   const j=await api('character/build',{reference_images:refs,user_facts:{preferred_name:preferredName,creator_note:creatorNote}});
   characterDraft=j.character||null;forceBuilder=false;
   loading('Карточка сохранена. Создаём калибровочный образ…');
   try{
     const cal=await api('identity/calibrate');
     calibrationImage=cal.calibration||'';
     render();
   }catch(calError){
     state=(await api('state')).state;
     render();
     alert('Карточка персонажа уже сохранена. Не удалось получить только калибровочное изображение — нажмите «Продолжить калибровку».');
   }
 }catch(e){alert(e.message);refresh()}finally{busy=false}
}
async function continueCalibration(){
 if(busy)return;
 busy=true;characterDraft=state?.my_character||characterDraft;loading('Создаём калибровочный образ…');
 try{
   const j=await api('identity/calibrate');
   calibrationImage=j.calibration||'';
   render();
 }catch(e){
   alert('Связь с генератором изображения прервалась. Карточка сохранена — можно повторить калибровку без повторной загрузки фото.');
   refresh();
 }finally{busy=false}
}

   const j=await api('story/draft/new',{creative_brief:''});

async function editCharacterFromMenu(){
 if(busy)return;
 if(state?.mode==='reader'){
   const ok=confirm('Чтобы изменить персонажа, текущий роман будет сохранён в архиве. Продолжить?');

async function start(){return startNewBook()}
async function exitStory(ask=true){
 if(busy)return;
 if(ask&&!confirm('Убрать текущий роман в архив? Персонажи сохранятся.'))return;
 busy=true;loading('Сохраняем роман в архив…');
 try{
   state=(await api('book/exit')).state;
   selectedAction='';menuMode=true;storyDraft=null;
   await loadLibrary();
   renderMainMenu();
 }catch(e){alert(e.message);refresh()}finally{busy=false}
}
async function sendReply(){

 busy=true;loading('Продолжаем роман из вашей реплики…');
 try{state=(await api('reply',{reply,action_key:selectedAction})).state;selectedAction='';render()}catch(e){alert(e.message);refresh()}finally{busy=false}
}
async function loadVisual(){try{const j=await api('visual');const img=document.getElementById('sceneImage');if(img&&j.image){img.src=j.image;img.classList.add('on')}}catch{}}
refresh();
