<body><main id="app"></main>
<script>
const app=document.getElementById('app');
const tg=window.Telegram?.WebApp;try{tg?.ready();tg?.expand()}catch{}
let state=null,busy=false,selectedAction='',calibrationImage='',characterDraft=null,forceBuilder=false,menuMode=false,libraryBooks=[],libraryDrafts=[],storyDraft=null,resumeStoryDraftId='',aiCharacters=[],roleGenderHints={A:'',B:''},characterDetailRole='',characterLooks={A:[],B:[]},characterLooksLoaded={A:false,B:false},characterViewerIndex=0,characterViewerRole='',aiAdvanceInFlight=false,aiAdvanceError='',aiAdvanceKey='';
let activeRequestControllers=new Set(),navigationEpoch=0;

function telegramInitData(){
 const sdk=String(window.Telegram?.WebApp?.initData||'');
 if(sdk)return sdk;
 for(const raw of [location.search,location.hash]){
   const q=String(raw||'').replace(/^[?#]/,'');
   if(!q)continue;
   const value=new URLSearchParams(q).get('tgWebAppData');
   if(value)return String(value);
 }
 return '';
}
function authHeaders(){
 const h={},data=telegramInitData();
 if(data)h['x-telegram-init-data']=data;
 if(location.hostname==='localhost')h['x-novel2-local-user']=localStorage.getItem('novel2_local_user')||'local_a';
 return h;
}
async function api(path,body={},timeoutMs=600000){
 const epoch=navigationEpoch,controller=new AbortController();
 activeRequestControllers.add(controller);
 const timer=setTimeout(()=>controller.abort(),timeoutMs);
 try{
   const r=await fetch('/novel2/api/'+path,{method:'POST',headers:{'content-type':'application/json',...authHeaders()},body:JSON.stringify(body),signal:controller.signal});
   if(epoch!==navigationEpoch)throw new Error('REQUEST_CANCELLED');
   const raw=await r.text();let j;
   try{j=raw?JSON.parse(raw):{}}
   catch{throw new Error(r.ok?'Сервис вернул повреждённый ответ. Повторите операцию.':'Не удалось получить корректный ответ сервера.')}
   if(!r.ok||!j.ok){
     const technical=String(j.error||'');
     if(/JSON|array element|position \d+|NOVEL2_AI_JSON_INVALID|Unexpected token|Expected ['"]/i.test(technical)){
       throw new Error('Не удалось собрать корректную структуру истории. Повторите создание — исходные данные не потеряны.');
     }
     if(technical==='NOVEL2_CURRENT_PLAYER_CHARACTER_REQUIRED')throw new Error('Сначала создайте и сохраните своего персонажа из фотографий.');
     throw new Error(technical||'REQUEST_FAILED');
   }
   return j;
 }catch(e){
   if(epoch!==navigationEpoch)throw new Error('REQUEST_CANCELLED');
   if(controller.signal.aborted)throw new Error('Операция превысила лимит ожидания. Вернитесь в меню и попробуйте ещё раз.');
   throw e;
 }finally{
   clearTimeout(timer);activeRequestControllers.delete(controller);
 }
}
function isCancelled(e){return String(e?.message||'')==='REQUEST_CANCELLED'}
function cancelRequestsToMenu(){
 navigationEpoch++;
 for(const controller of activeRequestControllers){try{controller.abort()}catch{}}
 activeRequestControllers.clear();
 stopLoading();
 busy=false;storyDraft=null;menuMode=true;
 renderMainMenu();
 void loadLibrary();
}
function esc(v=''){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
let processTimer=null,loadingEpoch=0;
function stopLoading(){
 loadingEpoch++;
 if(processTimer){clearInterval(processTimer);processTimer=null}
}
function formatWait(seconds=0){
 const s=Math.max(0,Math.floor(seconds)),m=Math.floor(s/60),r=s%60;

async function fileToReference(file){

   const src=URL.createObjectURL(file),img=new Image();
   await new Promise((resolve,reject)=>{img.onload=resolve;img.onerror=reject;img.src=src});
   const max=1800,scale=Math.min(1,max/Math.max(img.naturalWidth||1,img.naturalHeight||1));
   const canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(img.naturalWidth*scale));canvas.height=Math.max(1,Math.round(img.naturalHeight*scale));
   const ctx=canvas.getContext('2d',{alpha:false});ctx.drawImage(img,0,0,canvas.width,canvas.height);URL.revokeObjectURL(src);
   return canvas.toDataURL('image/jpeg',.84);
 }catch{return fallback()}
}

}
async function regenerateCalibration(){
 if(busy)return;busy=true;loading('Пересобираем actor sheet…','image',180);
 try{const j=await api('identity/calibrate');calibrationImage=j.calibration||'';render()}
 catch(e){alert(e.message);render()}finally{busy=false}
}
async function startNewBook(){
 if(busy)return;
 busy=true;loading('Создаём новую историю','story',600);
 try{
   const j=await api('story/draft/new',{creative_brief:''},600000);
   storyDraft=j.draft;menuMode=false;
   renderStoryDraft();
 }catch(e){if(isCancelled(e))return;alert(e.message);menuMode=true;renderMainMenu()}finally{busy=false}
}
async function editCharacterFromMenu(){
 if(busy)return;
 if(state?.mode==='reader'){
   const ok=confirm('Чтобы изменить персонажа, текущий роман будет сохранён в архиве. Продолжить?');
   if(!ok)return;
   busy=true;loading('Сохраняем текущий роман…');
   try{state=(await api('book/exit')).state}catch(e){alert(e.message);busy=false;return}
   busy=false;
 }
 menuMode=false;forceBuilder=true;render();
}
async function start(){return startNewBook()}
async function exitStory(ask=true){
 if(busy)return;
 if(ask&&!confirm('Убрать текущий роман в архив? Персонажи сохранятся.'))return;
 busy=true;loading('Сохраняем роман в архив…');
 try{
   state=(await api('book/exit')).state;
   selectedAction='';menuMode=true;storyDraft=null;
   await loadLibrary();
   renderMainMenu();
 }catch(e){alert(e.message);refresh()}finally{busy=false}
}
async function sendReply(){
 if(busy||!state?.can_reply)return;const box=document.getElementById('reply'),reply=box.value.trim();if(!reply)return;
 busy=true;loading('Продолжаем роман из вашей реплики…','story',600);
 try{state=(await api('reply',{reply,action_key:selectedAction},600000)).state;selectedAction='';render()}catch(e){if(isCancelled(e))return;alert(e.message);refresh()}finally{busy=false}
}
async function loadVisual(){try{const j=await api('visual');const img=document.getElementById('sceneImage');if(img&&j.image){img.src=j.image;img.classList.add('on')}}catch{}}
refresh();
</script>
</body>
</html>
