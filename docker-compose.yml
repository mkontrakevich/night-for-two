services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-night_for_two}
      POSTGRES_USER: ${POSTGRES_USER:-night}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-night}
    volumes:
      - night_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-night} -d ${POSTGRES_DB:-night_for_two}"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PORT: 5681
      DATABASE_URL: ${DATABASE_URL:-postgresql://night:night@postgres:5432/night_for_two}
      NIGHT_LOCAL_TEST_MODE: ${NIGHT_LOCAL_TEST_MODE:-false}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-openai/gpt-4.1-mini}
      PERSONAL_IMAGE_MODEL: ${PERSONAL_IMAGE_MODEL:-bytedance-seed/seedream-4.5}
      PERSONAL_IMAGE_FALLBACK_MODEL: ${PERSONAL_IMAGE_FALLBACK_MODEL:-google/gemini-2.5-flash-image}
      RELATIONSHIP_CONTEXT_URL: ${RELATIONSHIP_CONTEXT_URL:-http://marins_reminder_bot:5682/relationship-context}
      RELATIONSHIP_CONTEXT_TOKEN: ${RELATIONSHIP_CONTEXT_TOKEN:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      PRIMARY_OWNER_ID: ${PRIMARY_OWNER_ID:-}
      PARTNER_TELEGRAM_ID: ${PARTNER_TELEGRAM_ID:-}
      NIGHT_VISUAL_STORYBOARD: ${NIGHT_VISUAL_STORYBOARD:-1}
      NIGHT_VISUAL_QA_REQUIRED: ${NIGHT_VISUAL_QA_REQUIRED:-1}
      NIGHT_VISUAL_QA_THRESHOLD: ${NIGHT_VISUAL_QA_THRESHOLD:-0.78}
      NIGHT_VISUAL_QA_MODEL: ${NIGHT_VISUAL_QA_MODEL:-google/gemini-2.5-flash}
    volumes:
      - night_visuals:/app/config/night-visuals
    ports:
      - "${NIGHT_PORT:-5683}:5681"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - default
      - night_context

volumes:
  night_postgres:
  night_visuals:

networks:
  night_context:
    external: true
    name: ${NIGHT_CONTEXT_NETWORK:-night_for_two_context}
