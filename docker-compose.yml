services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-night_for_two}
      POSTGRES_USER: ${POSTGRES_USER:-night}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-night}
    volumes:
      - night_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-night} -d ${POSTGRES_DB:-night_for_two}"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PORT: 5681
      DATABASE_URL: ${DATABASE_URL:-postgresql://night:night@postgres:5432/night_for_two}
    ports:
      - "${NIGHT_PORT:-5681}:5681"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  night_postgres:
