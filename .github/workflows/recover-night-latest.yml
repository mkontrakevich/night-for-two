name: Recover Latest Night Novel

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/recover-night-latest.yml"

permissions:
  contents: read

jobs:
  recover:
    runs-on: [self-hosted, windows, x64, marins-production]
    timeout-minutes: 10
    steps:
      - name: Resume latest recoverable novel
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $app = 'night-for-two-app-1'
          $statusRaw = docker exec $app node scripts/night-linear-novel-status.mjs
          if ($LASTEXITCODE -ne 0) { throw 'NIGHT_STATUS_FAILED' }
          $line = @($statusRaw | Where-Object { $_ -match 'NIGHT_LINEAR_NOVEL_STATUS' })[-1]
          if (-not $line) { throw 'NIGHT_STATUS_LINE_MISSING' }
          $state = $line.Substring($line.IndexOf('{')) | ConvertFrom-Json
          Write-Host "NIGHT_RECOVERY_BEFORE id=$($state.id) status=$($state.status) pages=$($state.generated_pages)/$($state.total_pages) images=$($state.generated_images)/$($state.planned_images) readable=$($state.readable)"
          if (-not $state.id) { throw 'NIGHT_RECOVERY_NO_NOVEL' }
          if ($state.complete -eq $true -and $state.illustrations_complete -eq $true) {
            Write-Host 'NIGHT_RECOVERY_NOT_NEEDED complete=true illustrations_complete=true'
            exit 0
          }
          if ($state.complete -eq $true -and $state.illustrations_complete -ne $true) {
            Write-Host "NIGHT_RECOVERY_PENDING_ILLUSTRATIONS ready=$($state.generated_images) planned=$($state.planned_images)"
          }
          $top = docker top $app
          if ($top -match 'night-generate-linear-novel\.mjs') {
            Write-Host 'NIGHT_RECOVERY_ALREADY_RUNNING=true'
          } else {
            docker exec -d -e NIGHT_RESUME_NOVEL_ID=$($state.id) $app node scripts/night-generate-linear-novel.mjs
            if ($LASTEXITCODE -ne 0) { throw 'NIGHT_RECOVERY_START_FAILED' }
            Write-Host 'NIGHT_RECOVERY_STARTED=true'
          }

          $deadline = (Get-Date).AddMinutes(6)
          do {
            Start-Sleep -Seconds 5
            $topNow = docker top $app
            $running = $topNow -match 'night-generate-linear-novel\.mjs'
            $statusNow = docker exec $app node scripts/night-linear-novel-status.mjs
            $statusLine = @($statusNow | Where-Object { $_ -match 'NIGHT_LINEAR_NOVEL_STATUS' })[-1]
            if ($statusLine) {
              $current = $statusLine.Substring($statusLine.IndexOf('{')) | ConvertFrom-Json
              Write-Host "NIGHT_RECOVERY_POLL status=$($current.status) images=$($current.generated_images)/$($current.planned_images) failed=$($current.failed_images) running=$running"
            }
          } while ($running -and (Get-Date) -lt $deadline)

          if ($running) {
            docker logs $app --since 8m 2>&1 | Select-String -Pattern 'NIGHT_LINEAR_|NIGHT_VISUAL_|OPENROUTER|failed|error' | Select-Object -Last 220 | ForEach-Object { $_.Line }
            throw 'NIGHT_RECOVERY_TIMEOUT'
          }

          $statusFinalRaw = docker exec $app node scripts/night-linear-novel-status.mjs
          $statusFinalRaw | Out-Host
          $finalLine = @($statusFinalRaw | Where-Object { $_ -match 'NIGHT_LINEAR_NOVEL_STATUS' })[-1]
          if (-not $finalLine) { throw 'NIGHT_RECOVERY_FINAL_STATUS_MISSING' }
          $final = $finalLine.Substring($finalLine.IndexOf('{')) | ConvertFrom-Json

          docker logs $app --since 8m 2>&1 | Select-String -Pattern 'NIGHT_LINEAR_IMAGE_|NIGHT_VISUAL_QA_|NIGHT_LINEAR_NOVEL_|NIGHT_LINEAR_ILLUSTRATION_RESUME|OPENROUTER_IMAGE|OPENROUTER_VISUAL_QA|failed|error' | Select-Object -Last 260 | ForEach-Object { $_.Line }

          if ($final.illustrations_complete -ne $true) {
            throw "NIGHT_RECOVERY_ILLUSTRATIONS_INCOMPLETE:$($final.generated_images)/$($final.planned_images)"
          }
          Write-Host "NIGHT_RECOVERY_COMPLETE images=$($final.generated_images)/$($final.planned_images)"
