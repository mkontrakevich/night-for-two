name: TEREM Ornament v2 — Isolated Relay Deploy

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "terem-proof-relay/**"
      - ".github/workflows/terem-ornament-v2-relay.yml"

permissions:
  contents: read

concurrency:
  group: terem-ornament-v2-relay
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      PUBLIC_URL: https://terem-ornament-v2.kontrakevich.workers.dev
    steps:
      - uses: actions/checkout@v4
      - name: Verify relay isolation and credentials
        run: |
          test -f terem-proof-relay/src/index.js
          test -f terem-proof-relay/wrangler.jsonc
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Missing CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::Missing CLOUDFLARE_ACCOUNT_ID"; exit 1; }
          grep -q 'TEREM Two-Layer' terem-proof-relay/src/index.js
          grep -q 'source_absolute_coordinates_reused' terem-proof-relay/src/index.js
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Configure OpenRouter secret
        if: ${{ env.OPENROUTER_API_KEY != '' }}
        working-directory: terem-proof-relay
        run: printf '%s' "$OPENROUTER_API_KEY" | npx --yes wrangler@4 secret put OPENROUTER_API_KEY
      - name: Deploy isolated TEREM Worker
        working-directory: terem-proof-relay
        run: npx --yes wrangler@4 deploy
      - name: Enable workers.dev
        run: |
          API="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/terem-ornament-v2/subdomain"
          curl --fail --silent --show-error -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json" -X POST "$API" --data '{"enabled":true,"previews_enabled":false}' -o /tmp/subdomain.json
          python -c "import json; d=json.load(open('/tmp/subdomain.json')); assert d.get('success') is True"
      - name: Production gate
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 8 --retry-delay 3 "$PUBLIC_URL/" -o /tmp/index.html
          grep -q "Исходный референс" /tmp/index.html
          grep -q "Математическая реконструкция" /tmp/index.html
          grep -q "Новый орнамент по тем же законам" /tmp/index.html
          curl --fail --silent --show-error "$PUBLIC_URL/health" -o /tmp/health.json
          python -c "import json; d=json.load(open('/tmp/health.json')); assert d['ok'] and d['mode']=='two-layer-proof'; print('OPENROUTER_AVAILABLE='+str(d['openrouter_available'])); print('MODEL='+d['openrouter_model'])"
          curl --fail --silent --show-error "$PUBLIC_URL/variation.json" -o /tmp/variation.json
          python -c "import json; d=json.load(open('/tmp/variation.json')); assert d['cyclic_order']==12 and d['instance_count']==48 and d['source_absolute_coordinates_reused'] is False"
          for f in reference.svg reconstruction.svg variation.svg; do curl --fail --silent --show-error "$PUBLIC_URL/$f" -o "/tmp/$f"; test -s "/tmp/$f"; done
          echo "TEREM_ORNAMENT_V2_RELAY_PRODUCTION_OK"
