name: Novel 2 Preview Worker

on:
  push:
    branches: [main]
    paths:
      - "cloudflare/novel2-preview/**"
      - ".github/workflows/novel2-preview-worker.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: novel2-preview-worker
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: cloudflare/novel2-preview
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_TUNNEL_ID: ${{ secrets.CLOUDFLARE_TUNNEL_ID }}
      NOVEL2_SERVICE_SECRET: ${{ secrets.TELEGRAM_BOT_TOKEN }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Render verified VPC binding from Night42
        shell: bash
        run: |
          set -euo pipefail
          for key in CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_API_TOKEN CLOUDFLARE_TUNNEL_ID NOVEL2_SERVICE_SECRET; do
            test -n "${!key}" || { echo "::error::MISSING_$key"; exit 1; }
          done
          python - <<'PY'
          import json, os, re, urllib.request
          from pathlib import Path
          baseline='45bb34f4-a2cf-4fa1-9ce7-f57eedfd5f95'
          account=os.environ['CLOUDFLARE_ACCOUNT_ID']
          req=urllib.request.Request(
              f'https://api.cloudflare.com/client/v4/accounts/{account}/workers/scripts/night42/versions/{baseline}',
              headers={'Authorization':'Bearer '+os.environ['CLOUDFLARE_API_TOKEN']})
          with urllib.request.urlopen(req,timeout=25) as response:
              version=json.load(response)
          if not version.get('success'):
              raise SystemExit('NOVEL2_BASELINE_UNAVAILABLE')
          bindings=(version['result'].get('resources') or {}).get('bindings',[])
          def binding(name): return next((x for x in bindings if x.get('name')==name),None)
          vpc=binding('NIGHT_VPC')
          host=(binding('NIGHT_ORIGIN_HOST') or {}).get('text','')
          if not vpc or vpc.get('tunnel_id')!=os.environ['CLOUDFLARE_TUNNEL_ID']:
              raise SystemExit('NOVEL2_TUNNEL_MISMATCH')
          if not re.fullmatch(r'[A-Za-z0-9.-]+',host):
              raise SystemExit('NOVEL2_ORIGIN_HOST_INVALID')
          print('::add-mask::'+host)
          cfg=json.loads(Path('wrangler.jsonc').read_text())
          cfg['vars']['NOVEL2_ORIGIN_HOST']=host
          cfg['vpc_networks'][0]['tunnel_id']=vpc['tunnel_id']
          Path('wrangler.deploy.json').write_text(json.dumps(cfg,indent=2)+'\n')
          PY
      - name: Deploy preview Worker
        run: npx --yes wrangler@4 deploy --config wrangler.deploy.json
      - name: Verify stable preview
        shell: bash
        run: |
          set -euo pipefail
          base='https://novel2-preview.kontrakevich.workers.dev'
          for attempt in $(seq 1 20); do
            if curl --fail --silent --show-error --max-time 15 "$base/novel2/health" -o /tmp/novel2-health.json; then
              if jq -e '.ok == true and .product == "interactive_novel_2"' /tmp/novel2-health.json >/dev/null; then
                break
              fi
            fi
            sleep 3
          done
          jq -e '.ok == true and .product == "interactive_novel_2"' /tmp/novel2-health.json >/dev/null
          code=$(curl --silent --show-error --max-time 20 -o /tmp/novel2.html -w '%{http_code}' "$base/novel2/")
          test "$code" = 200
          service_key="$(printf 'novel2-ai-v1:%s' "$NOVEL2_SERVICE_SECRET" | sha256sum | awk '{print $1}')"
          text_payload='{"messages":[{"role":"user","content":"Reply with exactly OK."}],"temperature":0,"max_tokens":24}'
          text_code=$(curl --silent --show-error --max-time 45 -o /tmp/novel2-ai-text.json -w '%{http_code}' \
            -H 'content-type: application/json' \
            -H "x-novel2-service-key: $service_key" \
            --data "$text_payload" \
            "$base/novel2-ai/text")
          echo "NOVEL2_WORKERS_AI_TEXT_HTTP=$text_code"
          if [ "$text_code" != "200" ]; then cat /tmp/novel2-ai-text.json; exit 1; fi
          jq -e '.ok == true and (.content | type == "string") and (.content | length > 0)' /tmp/novel2-ai-text.json >/dev/null

          image_payload='{"prompt":"A plain neutral warm gray studio color swatch, no text, no people","width":256,"height":256}'
          image_code=$(curl --silent --show-error --max-time 90 -o /tmp/novel2-ai-image.json -w '%{http_code}' \
            -H 'content-type: application/json' \
            -H "x-novel2-service-key: $service_key" \
            --data "$image_payload" \
            "$base/novel2-ai/image")
          echo "NOVEL2_WORKERS_AI_IMAGE_HTTP=$image_code"
          if [ "$image_code" != "200" ]; then cat /tmp/novel2-ai-image.json; exit 1; fi
          jq -e '.ok == true and (.image | type == "string") and (.image | length > 100)' /tmp/novel2-ai-image.json >/dev/null

          image_b64=$(jq -r '.image' /tmp/novel2-ai-image.json)
          ref_payload=$(jq -cn --arg img "data:image/jpeg;base64,$image_b64" '{
            prompt:"Use image 0 as the visual reference. Recreate the same simple neutral gray studio swatch, no text, no people.",
            input_references:[$img],
            width:256,
            height:256
          }')
          ref_code=$(curl --silent --show-error --max-time 90 -o /tmp/novel2-ai-ref.json -w '%{http_code}' \
            -H 'content-type: application/json' \
            -H "x-novel2-service-key: $service_key" \
            --data "$ref_payload" \
            "$base/novel2-ai/image")
          echo "NOVEL2_WORKERS_AI_REFERENCE_IMAGE_HTTP=$ref_code"
          if [ "$ref_code" != "200" ]; then cat /tmp/novel2-ai-ref.json; exit 1; fi
          jq -e '.ok == true and (.image | type == "string") and (.image | length > 100)' /tmp/novel2-ai-ref.json >/dev/null

          image_b64=$(jq -r '.image' /tmp/novel2-ai-image.json)
          vision_payload=$(jq -cn --arg img "data:image/jpeg;base64,$image_b64" '{
            system:"Inspect the supplied image. Return a very short plain text description.",
            text:"What is visible?",
            images:[$img],
            temperature:0,
            max_tokens:96
          }')
          vision_code=$(curl --silent --show-error --max-time 90 -o /tmp/novel2-ai-vision.json -w '%{http_code}' \
            -H 'content-type: application/json' \
            -H "x-novel2-service-key: $service_key" \
            --data "$vision_payload" \
            "$base/novel2-ai/vision")
          echo "NOVEL2_WORKERS_AI_VISION_HTTP=$vision_code"
          if [ "$vision_code" != "200" ]; then cat /tmp/novel2-ai-vision.json; exit 1; fi
          jq -e '.ok == true and (.content | type == "string") and (.content | length > 0)' /tmp/novel2-ai-vision.json >/dev/null

          echo "NOVEL2_WORKERS_AI_READY=true"
                    echo "NOVEL2_PREVIEW_READY=$base/novel2/"
