name: Novel 2 Preview Worker

on:
  push:
    branches: [main]
    paths:
      - "cloudflare/novel2-preview/**"
      - "novel2/public/**"
      - ".github/workflows/novel2-preview-worker.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: novel2-preview-worker
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: cloudflare/novel2-preview
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_TUNNEL_ID: ${{ secrets.CLOUDFLARE_TUNNEL_ID }}
      NOVEL2_SERVICE_SECRET: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      NOVEL2_ALLOWED_USER_IDS: ${{ secrets.PRIMARY_OWNER_ID }},${{ secrets.PARTNER_TELEGRAM_ID }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Render verified VPC binding from Night42
        shell: bash
        run: |
          set -euo pipefail
          for key in CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_API_TOKEN CLOUDFLARE_TUNNEL_ID NOVEL2_SERVICE_SECRET; do
            test -n "${!key}" || { echo "::error::MISSING_$key"; exit 1; }
          done
          python - <<'PY'
          import json, os, re, urllib.request
          from pathlib import Path
          baseline='45bb34f4-a2cf-4fa1-9ce7-f57eedfd5f95'
          account=os.environ['CLOUDFLARE_ACCOUNT_ID']
          req=urllib.request.Request(
              f'https://api.cloudflare.com/client/v4/accounts/{account}/workers/scripts/night42/versions/{baseline}',
              headers={'Authorization':'Bearer '+os.environ['CLOUDFLARE_API_TOKEN']})
          with urllib.request.urlopen(req,timeout=25) as response:
              version=json.load(response)
          if not version.get('success'):
              raise SystemExit('NOVEL2_BASELINE_UNAVAILABLE')
          bindings=(version['result'].get('resources') or {}).get('bindings',[])
          def binding(name): return next((x for x in bindings if x.get('name')==name),None)
          vpc=binding('NIGHT_VPC')
          host=(binding('NIGHT_ORIGIN_HOST') or {}).get('text','')
          if not vpc or vpc.get('tunnel_id')!=os.environ['CLOUDFLARE_TUNNEL_ID']:
              raise SystemExit('NOVEL2_TUNNEL_MISMATCH')
          if not re.fullmatch(r'[A-Za-z0-9.-]+',host):
              raise SystemExit('NOVEL2_ORIGIN_HOST_INVALID')
          print('::add-mask::'+host)
          cfg=json.loads(Path('wrangler.jsonc').read_text())
          cfg['vars']['NOVEL2_ORIGIN_HOST']=host
          cfg['vpc_networks'][0]['tunnel_id']=vpc['tunnel_id']
          # D1 is provisioned once, then reused by UUID. No per-deploy clone.
          d1root=f'https://api.cloudflare.com/client/v4/accounts/{account}/d1/database'
          d1headers={'Authorization':'Bearer '+os.environ['CLOUDFLARE_API_TOKEN'],'Content-Type':'application/json'}
          d1list=urllib.request.Request(d1root+'?per_page=100',headers=d1headers)
          with urllib.request.urlopen(d1list,timeout=30) as response:
              available=json.load(response)
          if not available.get('success'): raise SystemExit('NOVEL2_D1_LIST_FAILED')
          existing=next((db for db in available.get('result',[]) if db.get('name')=='novel2-secret-noir'),None)
          if existing is None:
              create=urllib.request.Request(d1root,headers=d1headers,method='POST',
                  data=json.dumps({'name':'novel2-secret-noir'}).encode())
              with urllib.request.urlopen(create,timeout=30) as response:
                  fresh=json.load(response)
              if not fresh.get('success'): raise SystemExit('NOVEL2_D1_CREATE_FAILED')
              existing=fresh['result']
              print('NOVEL2_D1_CREATED=true')
          else:
              print('NOVEL2_D1_REUSED=true')
          database_id=existing.get('uuid') or existing.get('id') or ''
          if not re.fullmatch(r'[a-fA-F0-9-]{36}',database_id):
              raise SystemExit('NOVEL2_D1_UUID_INVALID')
          cfg['d1_databases'][0]['database_id']=database_id
          Path('wrangler.deploy.json').write_text(json.dumps(cfg,indent=2)+'\n')
          PY
      - name: Provision private R2 theatre bucket
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os,urllib.request,urllib.error
          root='https://api.cloudflare.com/client/v4/accounts/'+os.environ['CLOUDFLARE_ACCOUNT_ID']+'/r2/buckets'
          headers={'Authorization':'Bearer '+os.environ['CLOUDFLARE_API_TOKEN'],'Content-Type':'application/json'}
          name='novel2-secret-noir-theatre'
          req=urllib.request.Request(root+'/'+name,headers=headers)
          try:
              with urllib.request.urlopen(req,timeout=20) as response:
                  existing=json.load(response)
                  if not existing.get('success'): raise RuntimeError('R2_LOOKUP_FAILED')
              print('NOVEL2_R2_EXISTS=true')
          except urllib.error.HTTPError as exc:
              if exc.code!=404: raise
              request=urllib.request.Request(root,headers=headers,method='POST',data=json.dumps({'name':name}).encode())
              with urllib.request.urlopen(request,timeout=30) as response:
                  created=json.load(response)
                  if not created.get('success'): raise RuntimeError('R2_CREATE_FAILED')
              print('NOVEL2_R2_CREATED=true')
          PY
      - name: Apply versioned D1 schema remotely
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4 d1 migrations apply NOVEL2_DB --remote --config wrangler.deploy.json
      - name: Deploy preview Worker
        run: npx --yes wrangler@4 deploy --config wrangler.deploy.json
      - name: Bind OpenRouter key securely when available
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${OPENROUTER_API_KEY:-}" ]; then
            printf %s "$OPENROUTER_API_KEY" | npx --yes wrangler@4 secret put OPENROUTER_API_KEY --config wrangler.deploy.json
            echo 'NOVEL2_HOST_OPENROUTER_CONFIGURED=true'
          else
            echo 'NOVEL2_HOST_OPENROUTER_CONFIGURED=false'
          fi
      - name: Bind raw Telegram verification key separately from service auth
        shell: bash
        run: |
          set -euo pipefail
          test -n "${NOVEL2_SERVICE_SECRET:-}" || exit 1
          printf %s "$NOVEL2_SERVICE_SECRET" | npx --yes wrangler@4 secret put NOVEL2_TELEGRAM_BOT_TOKEN --config wrangler.deploy.json
      - name: Restrict AI Stranger to verified project guests
        shell: bash
        run: |
          set -euo pipefail
          owner="${NOVEL2_ALLOWED_USER_IDS%%,*}"
          test -n "$owner" || { echo '::error::NOVEL2_OWNER_ID_MISSING'; exit 1; }
          printf %s "$NOVEL2_ALLOWED_USER_IDS" | npx --yes wrangler@4 secret put NOVEL2_ALLOWED_USER_IDS --config wrangler.deploy.json
      - name: Diagnose protected OpenRouter Stranger provider (manual full smoke)
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          base='https://novel2-preview.kontrakevich.workers.dev'
          key="$(printf 'novel2-ai-v1:%s' "$NOVEL2_SERVICE_SECRET" | sha256sum | awk '{print $1}')"
          python - <<'PY'
          import json
          body={'messages':[
            {'role':'system','content':'Return only one JSON object with fields stage, line, next_action. Set stage=invitation and next_action=accept_invitation; line must be a Russian welcome sentence.'},
            {'role':'user','content':'{}'}],
            'temperature':0.2,'max_tokens':170}
          open('/tmp/noir-host-probe.json','w').write(json.dumps(body,ensure_ascii=False))
          PY
          code=$(curl --silent --show-error --max-time 35 -o /tmp/noir-host-result.json -w '%{http_code}' \
            -H 'content-type: application/json' -H "x-novel2-service-key: $key" \
            --data-binary @/tmp/noir-host-probe.json "$base/novel2-ai/host" || true)
          echo "NOVEL2_HOST_DIAG_HTTP=$code"
          if [ "$code" = 200 ]; then
            jq -r '"NOVEL2_HOST_DIAG_PROVIDER=" + (.provider // "unknown")' /tmp/noir-host-result.json
            jq -r '"NOVEL2_HOST_DIAG_OPENROUTER_FALLBACK=" + (.openrouter_failure // "none")' /tmp/noir-host-result.json
          fi
      - name: Verify published UI revision and Secret Host assets
        shell: bash
        run: |
          set -euo pipefail
          base='https://novel2-preview.kontrakevich.workers.dev'
          expected=$(python - <<'PY'
          import re
          from pathlib import Path
          s=Path('../../novel2/public/index.html').read_text()
          m=re.search(r'<meta name="novel2-ui-release" content="([^"]+)">',s)
          if not m: raise SystemExit('NOVEL2_SOURCE_UI_VERSION_MISSING')
          print(m.group(1))
          PY
          )
          ready=0
          for attempt in $(seq 1 5); do
            code=$(curl -sS --max-time 25 -o /tmp/novel2-public-ui.html -w '%{http_code}' "$base/novel2/?asset_release=$expected" || true)
            if [ "$code" = 200 ] && grep -Fq "content=\"$expected\"" /tmp/novel2-public-ui.html; then ready=1; break; fi
            echo "NOVEL2_ASSET_HTML_PROBE_${attempt}=${code}"
            sleep 3
          done
          test "$ready" = 1 || { echo '::error::NOVEL2_PUBLIC_ASSETS_STALE'; exit 1; }
          for asset in noir-experience.js noir-experience.css noir-host.js noir-host.css; do
            code=$(curl -sS --max-time 25 -o "/tmp/novel2-${asset}" -w '%{http_code}' "$base/novel2/$asset" || true)
            test "$code" = 200 || { echo "::error::NOVEL2_PUBLIC_ASSET_MISSING:$asset:$code"; exit 1; }
          done
          grep -Fq 'const nativeMainMenu=renderMainMenu;' /tmp/novel2-noir-host.js
          grep -Fq 'noirReader' /tmp/novel2-noir-experience.js
          ! grep -Fq '/novel2/noir-gateway.js' /tmp/novel2-public-ui.html
          echo "NOVEL2_PUBLIC_ASSETS_VERIFIED=$expected"

      - name: Verify stable preview
        shell: bash
        run: |
          set -euo pipefail
          base='https://novel2-preview.kontrakevich.workers.dev'
          service_key="$(printf 'novel2-ai-v1:%s' "$NOVEL2_SERVICE_SECRET" | sha256sum | awk '{print $1}')"
          probe_code=$(curl --silent --show-error --max-time 12 -o /tmp/novel2-vpc-probe.json -w '%{http_code}' \
            -X POST -H "x-novel2-service-key: $service_key" "$base/novel2-ai/vpc-probe")
          echo "NOVEL2_VPC_PROBE_HTTP=$probe_code"
          cat /tmp/novel2-vpc-probe.json
          echo
          for attempt in $(seq 1 20); do
            if curl --fail --silent --show-error --max-time 15 "$base/novel2/health" -o /tmp/novel2-health.json; then
              if jq -e '.ok == true and .product == "interactive_novel_2"' /tmp/novel2-health.json >/dev/null; then
                break
              fi
            fi
            sleep 3
          done
          jq -e '.ok == true and .product == "interactive_novel_2"' /tmp/novel2-health.json >/dev/null
          code=$(curl --silent --show-error --max-time 20 -o /tmp/novel2.html -w '%{http_code}' "$base/novel2/")
          test "$code" = 200
          # Every push deploy must be inexpensive. Full text / 3 image / vision
          # model smoke is available via the manual workflow_dispatch trigger.
          if [ "${GITHUB_EVENT_NAME:-}" != "workflow_dispatch" ]; then
            echo "NOVEL2_CHARGEABLE_AI_SMOKE_SKIPPED_ON_PUSH=true"
            echo "NOVEL2_PREVIEW_READY=$base/novel2/"
            exit 0
          fi
          text_payload='{"messages":[{"role":"user","content":"Reply with exactly OK."}],"temperature":0,"max_tokens":24}'
          text_code=$(curl --silent --show-error --max-time 45 -o /tmp/novel2-ai-text.json -w '%{http_code}' \
            -H 'content-type: application/json' \
            -H "x-novel2-service-key: $service_key" \
            --data "$text_payload" \
            "$base/novel2-ai/text")
          echo "NOVEL2_WORKERS_AI_TEXT_HTTP=$text_code"
          if [ "$text_code" != "200" ]; then cat /tmp/novel2-ai-text.json; exit 1; fi
          jq -e '.ok == true and (.content | type == "string") and (.content | length > 0)' /tmp/novel2-ai-text.json >/dev/null

          image_payload='{"prompt":"A plain neutral warm gray studio color swatch, no text, no people","width":256,"height":256}'
          image_code=$(curl --silent --show-error --max-time 90 -o /tmp/novel2-ai-image.json -w '%{http_code}' \
            -H 'content-type: application/json' \
            -H "x-novel2-service-key: $service_key" \
            --data "$image_payload" \
            "$base/novel2-ai/image")
          echo "NOVEL2_WORKERS_AI_IMAGE_HTTP=$image_code"
          if [ "$image_code" != "200" ]; then cat /tmp/novel2-ai-image.json; exit 1; fi
          jq -e '.ok == true and (.image | type == "string") and (.image | length > 100)' /tmp/novel2-ai-image.json >/dev/null

          image_b64=$(jq -r '.image' /tmp/novel2-ai-image.json)
          ref_payload=$(jq -cn --arg img "data:image/jpeg;base64,$image_b64" '{
            prompt:"Use image 0 as the visual reference. Recreate the same simple neutral gray studio swatch, no text, no people.",
            input_references:[$img],
            width:256,
            height:256
          }')
          ref_code=$(curl --silent --show-error --max-time 90 -o /tmp/novel2-ai-ref.json -w '%{http_code}' \
            -H 'content-type: application/json' \
            -H "x-novel2-service-key: $service_key" \
            --data "$ref_payload" \
            "$base/novel2-ai/image")
          echo "NOVEL2_WORKERS_AI_REFERENCE_IMAGE_HTTP=$ref_code"
          if [ "$ref_code" != "200" ]; then cat /tmp/novel2-ai-ref.json; exit 1; fi
          jq -e '.ok == true and (.image | type == "string") and (.image | length > 100)' /tmp/novel2-ai-ref.json >/dev/null

          # Production-equivalent dimensions, synthetic swatch only. Confirm
          # streamed JSON stays valid after heartbeat whitespace. No user photos.
          stream_payload=$(jq -cn --arg img "data:image/jpeg;base64,$image_b64" '{
            prompt:"Produce a large flat neutral gray studio color swatch, no people, no letters",
            input_references:[$img],width:832,height:1344,keepalive:true
          }')
          stream_code=$(curl --silent --show-error --max-time 100 -o /tmp/novel2-ai-stream.json -w '%{http_code}' \
            -H 'content-type: application/json' \
            -H "x-novel2-service-key: $service_key" \
            --data "$stream_payload" \
            "$base/novel2-ai/image")
          echo "NOVEL2_WORKERS_AI_STREAM_IMAGE_HTTP=$stream_code"
          if [ "$stream_code" != "200" ]; then exit 1; fi
          jq -e '.ok == true and (.image | type == "string") and (.image | length > 100)' /tmp/novel2-ai-stream.json >/dev/null
          echo "NOVEL2_WORKERS_AI_STREAM_IMAGE_READY=true"

          image_b64=$(jq -r '.image' /tmp/novel2-ai-image.json)
          vision_payload=$(jq -cn --arg img "data:image/jpeg;base64,$image_b64" '{
            system:"Inspect the supplied image. Return a very short plain text description.",
            text:"What is visible?",
            images:[$img],
            temperature:0,
            max_tokens:96
          }')
          vision_code=$(curl --silent --show-error --max-time 90 -o /tmp/novel2-ai-vision.json -w '%{http_code}' \
            -H 'content-type: application/json' \
            -H "x-novel2-service-key: $service_key" \
            --data "$vision_payload" \
            "$base/novel2-ai/vision")
          echo "NOVEL2_WORKERS_AI_VISION_HTTP=$vision_code"
          if [ "$vision_code" != "200" ]; then cat /tmp/novel2-ai-vision.json; exit 1; fi
          jq -e '.ok == true and (.content | type == "string") and (.content | length > 0)' /tmp/novel2-ai-vision.json >/dev/null

          echo "NOVEL2_WORKERS_AI_READY=true"
                    echo "NOVEL2_PREVIEW_READY=$base/novel2/"
      - name: Start idempotent private legacy snapshot migration
        shell: bash
        run: |
          set -euo pipefail
          base='https://novel2-preview.kontrakevich.workers.dev'
          key="$(printf 'novel2-ai-v1:%s' "$NOVEL2_SERVICE_SECRET" | sha256sum | awk '{print $1}')"
          code=$(curl -sS --max-time 35 -o /tmp/novel2-migration-start.json -w '%{http_code}' \
            -H 'content-type: application/json' -H "x-novel2-service-key: $key" \
            --data '{"confirm":"COPY_PRIVATE_LEGACY_DATA_TO_CLOUDFLARE"}' \
            "$base/novel2-ai/migration/start")
          test "$code" = 202 -o "$code" = 200 || { echo 'NOVEL2_MIGRATION_START_FAILED'; exit 1; }
          jq -e '.ok == true and (.job_id | type == "string")' /tmp/novel2-migration-start.json >/dev/null
          echo 'NOVEL2_PRIVATE_MIGRATION_SCHEDULED=true'
      - name: Verify protected legacy migration progress
        shell: bash
        run: |
          set -euo pipefail
          base='https://novel2-preview.kontrakevich.workers.dev'
          key="$(printf 'novel2-ai-v1:%s' "$NOVEL2_SERVICE_SECRET" | sha256sum | awk '{print $1}')"
          status_code=$(curl -sS --max-time 30 -o /tmp/novel2-migration-status.json -w '%{http_code}' \
            -H 'content-type: application/json' -H "x-novel2-service-key: $key" \
            --data '{}' "$base/novel2-ai/migration/status")
          test "$status_code" = 200 || { echo "::error::NOVEL2_MIGRATION_STATUS_UNAVAILABLE:$status_code"; exit 1; }
          jq -e '.ok == true and (.migration.state | type=="string")' /tmp/novel2-migration-status.json >/dev/null
          state=$(jq -r '.migration.state' /tmp/novel2-migration-status.json)
          records=$(jq -r '.migration.records // 0' /tmp/novel2-migration-status.json)
          echo "NOVEL2_MIGRATION_STATE=$state"
          echo "NOVEL2_MIGRATION_RECORDS_INDEXED=$records"
          if [ "$state" = failed ]; then
            code=$(jq -r '.migration.error_code // "UNKNOWN"' /tmp/novel2-migration-status.json)
            echo "::warning::NOVEL2_LEGACY_EXPORT_BLOCKED:$code"
          fi
      - name: Verify native Stranger with signed Telegram request
        shell: bash
        run: python scripts/probe_stranger.py
