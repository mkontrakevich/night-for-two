name: CI

on:
  push:
    branches: [main, feat/prompt-evaluation-core]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Enforce Night42 repository boundary
        run: python3 scripts/check_repository_boundary.py
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm test
      - name: Night4two model tests (mocked, no paid API calls)
        run: |
          node cloudflare/novel2-preview/scripts/model-test-drive.test.mjs
          node cloudflare/night4two-drive-oauth/scripts/ingest.test.mjs
          node cloudflare/novel2-preview/scripts/model-test-state.test.mjs
          node cloudflare/novel2-preview/scripts/model-comparison.test.mjs
          node --experimental-loader ./cloudflare/novel2-preview/scripts/cloudflare-test-loader.mjs cloudflare/novel2-preview/scripts/model-test-api.test.mjs
          node --experimental-loader ./cloudflare/novel2-preview/scripts/cloudflare-test-loader.mjs cloudflare/novel2-preview/scripts/model-test-cloud.test.mjs
      - name: Night4two P0 model tests (mocked)
        run: node --experimental-loader ./cloudflare/novel2-preview/scripts/cloudflare-test-loader.mjs cloudflare/novel2-preview/scripts/model-test-p0.test.mjs
      - name: Night4two image-reference adapter (mocked, no paid calls)
        run: node cloudflare/novel2-preview/scripts/model-test-image.test.mjs
      - name: Night4two P1 Drive binary export (mocked)
        run: node cloudflare/night4two-drive-oauth/scripts/media-drive-ingest.test.mjs
      - name: Night4two P1 stateful approvals (mocked)
        run: node --experimental-loader ./cloudflare/novel2-preview/scripts/cloudflare-test-loader.mjs cloudflare/novel2-preview/scripts/model-test-p1.test.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install illustration pipeline dependencies
        run: python -m pip install -r illustration_pipeline/requirements.txt
      - name: Python syntax check
        run: python -m py_compile illustration_pipeline/*.py
      - name: Illustration pipeline unit tests
        run: python -m unittest illustration_pipeline/test_pipeline.py

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build standalone image
        run: docker build -t night-for-two:ci .
