name: Diagnose Night production origin

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/diagnose-night-origin.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: [self-hosted, windows, x64, marins-production]
    timeout-minutes: 8
    steps:
      - name: Inspect local origin and tunnel without changes
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Write-Host '=== LOCAL HEALTH ==='
          $night = Invoke-RestMethod -Uri 'http://127.0.0.1:5683/night/health' -TimeoutSec 15
          $actions = Invoke-RestMethod -Uri 'http://127.0.0.1:5683/actions/health' -TimeoutSec 15
          Write-Host "Night ok=$($night.ok) db=$($night.db)"
          Write-Host "Actions ok=$($actions.ok) product=$($actions.product)"

          Write-Host '=== DOCKER ==='
          docker ps --filter "name=night-for-two" --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"

          Write-Host '=== HOST IP ==='
          $ips = Get-NetIPAddress -AddressFamily IPv4 | Where-Object {$_.IPAddress -notlike '127.*'} | Select-Object InterfaceAlias,IPAddress,PrefixLength
          $ips | Format-Table -Auto
          $hasOriginIp = @($ips | Where-Object {$_.IPAddress -eq '10.0.130.218'}).Count -gt 0
          Write-Host "Has 10.0.130.218=$hasOriginIp"

          Write-Host '=== ORIGIN TCP ==='
          $tcpOrigin = Test-NetConnection -ComputerName '10.0.130.218' -Port 5683 -InformationLevel Detailed -WarningAction SilentlyContinue
          Write-Host "10.0.130.218:5683 success=$($tcpOrigin.TcpTestSucceeded) source=$($tcpOrigin.SourceAddress)"

          Write-Host '=== CLOUDFLARED ==='
          $raw = docker inspect night-prod-cloudflared 2>$null
          if ($LASTEXITCODE -eq 0 -and $raw) {
            $container = @($raw | ConvertFrom-Json)[0]
            Write-Host "Tunnel container state=$($container.State.Status) running=$($container.State.Running) restarts=$($container.RestartCount)"
            $ErrorActionPreference = 'Continue'
            $lines = @(docker logs --tail 120 --since 30m night-prod-cloudflared 2>&1 | ForEach-Object {$_.ToString()})
            $ErrorActionPreference = 'Stop'
            foreach ($flag in @('Registered tunnel connection','connection refused','handshake timeout','Failed to','ERR ','reconnect')) {
              $count = @($lines | Where-Object {$_.IndexOf($flag,[System.StringComparison]::OrdinalIgnoreCase) -ge 0}).Count
              Write-Host "Tunnel log [$flag]=$count"
            }
          } else {
            Write-Host 'Tunnel container missing'
          }

          Write-Host '=== PUBLIC HEALTH ==='
          try {
            $r = Invoke-WebRequest -UseBasicParsing -Uri 'https://night42.kontrakevich.workers.dev/night/health' -TimeoutSec 20 -ErrorAction Stop
            Write-Host "Public status=$([int]$r.StatusCode) body=$($r.Content)"
          } catch {
            if ($_.Exception.Response) {
              $resp=$_.Exception.Response
              Write-Host "Public status=$([int]$resp.StatusCode)"
            } else {
              Write-Host "Public error=$($_.Exception.Message)"
            }
          }
