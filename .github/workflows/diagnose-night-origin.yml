name: Diagnose Night production origin

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/diagnose-night-origin.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: [self-hosted, windows, x64, marins-production]
    timeout-minutes: 8
    steps:
      - name: Inspect Night container stop reason
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          $raw = docker inspect night-for-two-app-1
          if ($LASTEXITCODE -ne 0 -or -not $raw) { throw 'NIGHT_APP_CONTAINER_MISSING' }
          $c = @($raw | ConvertFrom-Json)[0]
          Write-Host "State status=$($c.State.Status) running=$($c.State.Running) paused=$($c.State.Paused) restarting=$($c.State.Restarting)"
          Write-Host "ExitCode=$($c.State.ExitCode) OOMKilled=$($c.State.OOMKilled) Error=$($c.State.Error)"
          Write-Host "StartedAt=$($c.State.StartedAt) FinishedAt=$($c.State.FinishedAt) RestartCount=$($c.RestartCount)"
          Write-Host "RestartPolicy=$($c.HostConfig.RestartPolicy.Name)"
          Write-Host "ComposeProject=$($c.Config.Labels.'com.docker.compose.project')"
          Write-Host "ComposeWorkingDir=$($c.Config.Labels.'com.docker.compose.project.working_dir')"
          Write-Host "ComposeConfigFiles=$($c.Config.Labels.'com.docker.compose.project.config_files')"
          Write-Host '=== EVENTS ==='
          $since = (Get-Date).AddHours(-2).ToUniversalTime().ToString('yyyy-MM-ddTHH:mm:ssZ')
          docker events --since $since --until (Get-Date).ToUniversalTime().ToString('yyyy-MM-ddTHH:mm:ssZ') --filter "container=night-for-two-app-1" --format "{{.Time}} {{.Action}} {{json .Actor.Attributes}}" | Select-Object -Last 80
