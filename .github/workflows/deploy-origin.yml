name: Deploy Standalone Origin — Bridge Only

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  canonical-bridge-required:
    runs-on: ubuntu-latest
    steps:
      - name: Block unsafe direct production deployment
        shell: bash
        run: |
          echo "::error::Direct Night42 production deployment from night-for-two is disabled."
          echo "::error::Use mkontrakevich/marins-reminder-bot/.github/workflows/night-for-two-production-bridge.yml."
          echo "::error::The canonical bridge owns the persistent PostgreSQL credential, Relationship Context token, private network, and production health gates."
          exit 1
