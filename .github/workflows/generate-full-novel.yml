name: Generate Full Novel

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "ops/generate-room17-v2.trigger"

permissions:
  contents: write

concurrency:
  group: night-full-novel-generation
  cancel-in-progress: false

jobs:
  generate:
    runs-on: [self-hosted, windows, x64, marins-production]
    timeout-minutes: 240
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL || 'openai/gpt-4.1-mini' }}
      PERSONAL_IMAGE_MODEL: ${{ vars.PERSONAL_IMAGE_MODEL || 'bytedance-seed/seedream-4.5' }}
      PERSONAL_IMAGE_FALLBACK_MODEL: ${{ vars.PERSONAL_IMAGE_FALLBACK_MODEL || 'google/gemini-2.5-flash-image' }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      PRIMARY_OWNER_ID: ${{ secrets.PRIMARY_OWNER_ID }}
      PARTNER_TELEGRAM_ID: ${{ secrets.PARTNER_TELEGRAM_ID }}
      RELATIONSHIP_CONTEXT_URL: ${{ vars.RELATIONSHIP_CONTEXT_URL }}
      RELATIONSHIP_CONTEXT_TOKEN: ${{ secrets.RELATIONSHIP_CONTEXT_TOKEN }}
      NIGHT_VISUAL_STORYBOARD: "1"
      NIGHT_VISUAL_QA_REQUIRED: "1"
      NIGHT_VISUAL_QA_THRESHOLD: "0.78"
      NIGHT_VISUAL_QA_MODEL: ${{ vars.NIGHT_VISUAL_QA_MODEL || 'google/gemini-2.5-flash' }}

    steps:
      - uses: actions/checkout@v4

      - name: Start standalone stack
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          docker compose up -d --build
          if ($LASTEXITCODE -ne 0) { throw "NIGHT_STACK_START_FAILED:$LASTEXITCODE" }

      - name: Probe novel store
        shell: powershell
        run: |
          docker compose exec -T app node scripts/night-linear-novel-status.mjs
          if ($LASTEXITCODE -ne 0) { throw "NIGHT_NOVEL_STATUS_PROBE_FAILED:$LASTEXITCODE" }

      - name: Generate or reuse fresh completed novel
        shell: powershell
        timeout-minutes: 220
        run: |
          $ErrorActionPreference = 'Continue'
          $requestedLine = Select-String -Path "ops/generate-room17-v2.trigger" -Pattern '^requested_at=' | Select-Object -Last 1
          $requested = if ($requestedLine) { ($requestedLine.Line -split '=',2)[1].Trim() } else { "" }

          $reuse = $false
          if ($requested) {
            docker compose exec -T app node scripts/night-reuse-complete.mjs "--after=$requested"
            if ($LASTEXITCODE -eq 0) { $reuse = $true }
          }

          if ($reuse) {
            Write-Host "Fresh completed novel found after trigger timestamp; skipping duplicate generation."
          } else {
            docker compose exec -T app node scripts/night-generate-linear-novel.mjs
            if ($LASTEXITCODE -ne 0) { throw "NIGHT_FULL_NOVEL_GENERATION_FAILED:$LASTEXITCODE" }
          }

      - name: Require complete
        shell: powershell
        run: |
          $status = docker compose exec -T app node scripts/night-linear-novel-status.mjs --require-complete
          $status | Out-Host
          if ($LASTEXITCODE -ne 0) { throw "NIGHT_FULL_NOVEL_NOT_COMPLETE:$LASTEXITCODE" }

      - name: Export static reader
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          if (Test-Path "_reader_export") { Remove-Item "_reader_export" -Recurse -Force }
          New-Item -ItemType Directory -Path "_reader_export" | Out-Null
          $cid = docker compose ps -q app
          if (-not $cid) { throw "NIGHT_APP_CONTAINER_MISSING" }
          docker compose exec -T app node scripts/night-export-static-reader.mjs --output=/tmp/night-reader-export
          if ($LASTEXITCODE -ne 0) { throw "NIGHT_STATIC_EXPORT_FAILED:$LASTEXITCODE" }
          docker cp "${cid}:/tmp/night-reader-export/." "_reader_export"
          if ($LASTEXITCODE -ne 0) { throw "NIGHT_STATIC_EXPORT_COPY_FAILED:$LASTEXITCODE" }

      - name: Publish generated reader to repository
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name "night-for-two-bot"
          git config user.email "night-for-two-bot@users.noreply.github.com"
          git fetch origin main
          git rebase origin/main

          $targets = @(
            "docs/index.html",
            "docs/story.json",
            "docs/manifest.json",
            "docs/assets/generated"
          )
          foreach ($target in $targets) {
            if (Test-Path $target) { Remove-Item $target -Recurse -Force }
          }
          New-Item -ItemType Directory -Path "docs" -Force | Out-Null
          Copy-Item "_reader_export/index.html" "docs/index.html" -Force
          Copy-Item "_reader_export/story.json" "docs/story.json" -Force
          Copy-Item "_reader_export/manifest.json" "docs/manifest.json" -Force
          New-Item -ItemType Directory -Path "docs/assets" -Force | Out-Null
          Copy-Item "_reader_export/assets/generated" "docs/assets/generated" -Recurse -Force

          git add docs/index.html docs/story.json docs/manifest.json docs/assets/generated
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Reader already current; no publication commit needed."
            exit 0
          }
          git commit -m "Publish generated Room 17 personalized reader"
          git push origin HEAD:main
          if ($LASTEXITCODE -ne 0) { throw "NIGHT_READER_PUSH_FAILED:$LASTEXITCODE" }
