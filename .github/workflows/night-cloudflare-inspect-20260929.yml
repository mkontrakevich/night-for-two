name: Inspect Night Cloudflare deployment

on:
  push:
    branches: [main]
    paths: [.github/workflows/night-cloudflare-inspect-20260929.yml]

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_TUNNEL: ${{ secrets.CLOUDFLARE_TUNNEL_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Compare current Worker bindings with known Reader version
        shell: bash
        run: |
          python - <<'PY'
          import json, os, urllib.request, urllib.error
          from pathlib import Path
          base=f"https://api.cloudflare.com/client/v4/accounts/{os.environ['CF_ACCOUNT']}"
          headers={"Authorization":"Bearer "+os.environ["CF_TOKEN"]}
          def get(path):
              request=urllib.request.Request(base+path,headers=headers)
              try:
                  with urllib.request.urlopen(request,timeout=25) as response:
                      return json.load(response)
              except urllib.error.HTTPError as exc:
                  return {"success":False,"http_status":exc.code}
          def bindings(version_id):
              data=get(f"/workers/scripts/night42/versions/{version_id}")
              result=data.get("result") or {}
              entries=(result.get("resources") or {}).get("bindings") or []
              return data,result,{entry.get("name"):entry for entry in entries}
          lines=[]
          d=get("/workers/scripts/night42/deployments")
          result=d.get("result") or []
          deployments=result if isinstance(result,list) else result.get("deployments",[])
          baseline="45bb34f4-a2cf-4fa1-9ce7-f57eedfd5f95"
          bd,br,bb=bindings(baseline)
          origin=(bb.get("NIGHT_ORIGIN_HOST") or {}).get("text")
          binding_summary=','.join(k+':'+str(v.get('type')) for k,v in bb.items())
          lines.append(f"Baseline success={bd.get('success')} bindings={binding_summary}")
          for item in deployments[:2]:
              lines.append(f"Deployment keys={','.join(sorted(item.keys()))}")
          for item in deployments[:4]:
              vid=(item.get("versions") or [{}])[0].get("version_id")
              vd,vr,vb=bindings(vid) if vid else ({},{},{})
              host=(vb.get("NIGHT_ORIGIN_HOST") or {}).get("text")
              port=(vb.get("NIGHT_ORIGIN_PORT") or {}).get("text")
              tunnel=(vb.get("NIGHT_VPC") or {}).get("tunnel_id")
              anns=vr.get("annotations") or {}
              safe_annotations={key:value for key,value in anns.items() if key in ("workers/triggered_by","workers/commit_hash","workers/deployment_message")}
              lines.append(f"Deployment created={item.get('created_on')} version={vid} reader_binding={('READER_ASSETS' in vb)} host_match={host==origin} port_match={port=='5683'} tunnel_match={tunnel==os.environ['CF_TUNNEL']} version_success={vd.get('success')} source={item.get('source')} annotations={safe_annotations}")
          t=get(f"/cfd_tunnel/{os.environ['CF_TUNNEL']}")
          obj=t.get("result") or {}
          lines.append(f"Tunnel status={obj.get('status')} connection_count={len(obj.get('connections') or [])}")
          for conn in obj.get("connections") or []:
              lines.append(f"Tunnel connection keys={','.join(sorted(conn.keys()))} version={conn.get('client_version')} opened={conn.get('opened_at')} pending={conn.get('is_pending_reconnect')}")
          c=get(f"/cfd_tunnel/{os.environ['CF_TUNNEL']}/connections")
          cr=c.get("result") or []
          clients=cr if isinstance(cr,list) else cr.get("connections",[])
          lines.append(f"Tunnel client_count={len(clients)} status={c.get('http_status','ok')}")
          for client in clients:
              links=client.get("connections") or []
              lines.append(f"Client keys={','.join(sorted(client.keys()))} version={client.get('client_version')} run_at={client.get('run_at')} active_connections={len(links)}")
          Path("ops/night-cloudflare-inspect-result.txt").parent.mkdir(exist_ok=True)
          Path("ops/night-cloudflare-inspect-result.txt").write_text("\n".join(lines)+"\n")
          print("\n".join(lines))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ops/night-cloudflare-inspect-result.txt
          git commit -m "Record current Night Worker binding comparison"
          git push
