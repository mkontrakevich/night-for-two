name: TEREM Pattern Lab — Mobile Canary

on:
  push:
    branches: [main]
    paths:
      - "cloudflare/terem-pattern-lab-mobile/**"
      - ".github/workflows/terem-pattern-lab-mobile-canary.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: terem-pattern-lab-mobile-canary
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: cloudflare/terem-pattern-lab-mobile
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

    steps:
      - uses: actions/checkout@v4
      - name: Verify Cloudflare authorization
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_API_TOKEN"
      - name: Deploy canary
        run: npx --yes wrangler@4 deploy
      - name: Enable workers.dev route
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error             -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"             -H "Content-Type: application/json"             -X POST             "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/terem-pattern-lab-mobile/subdomain"             --data '{"enabled":true,"previews_enabled":false}' > /tmp/subdomain.json
          python -c "import json; d=json.load(open('/tmp/subdomain.json')); assert d.get('success') is True; assert (d.get('result') or {}).get('enabled') is True"

      - name: Verify canary
        shell: bash
        run: |
          set -euo pipefail
          URL="https://terem-pattern-lab-mobile.kontrakevich.workers.dev"
          curl --fail --silent --show-error --retry 5 --retry-delay 3 "$URL/" -o /tmp/lab.html
          grep -q "Pattern Laboratory" /tmp/lab.html
          grep -q "mobile-nav-toggle" /tmp/lab.html
          curl --fail --silent --show-error "$URL/library-index" -o /tmp/library.html
          grep -q "TEREM Visual DNA" /tmp/library.html
          curl --fail --silent --show-error "$URL/grammar.v1.json" -o /tmp/grammar.json
          python -c "import json; d=json.load(open('/tmp/grammar.json')); assert d['pipeline']==['SOURCE','DNA','RULES','GENERATE']"
          echo "TEREM_MOBILE_CANARY_OK"
