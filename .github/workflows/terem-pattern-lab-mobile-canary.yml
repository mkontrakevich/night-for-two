name: TEREM Pattern Lab — Mobile Canary

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/terem-pattern-lab-mobile-canary.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - name: Verify Cloudflare authorization
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_API_TOKEN"

      - name: Materialize canary
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/terem-pattern-lab-mobile
          mkdir -p /tmp/terem-pattern-lab-mobile/public /tmp/terem-pattern-lab-mobile/src
          cat > /tmp/terem-pattern-lab-mobile/public/index.html <<'HTML'
<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#0b0b0c">
  <title>TEREM Pattern Laboratory</title>
  <style>
    *{box-sizing:border-box}
    :root{--bg:#0b0b0c;--panel:#121316;--line:#2b2d31;--text:#f2f0eb;--muted:#96989e;--soft:#191b1f;--accent:#d9c7a0}
    body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,Arial,sans-serif}
    a{color:inherit}
    .shell{min-height:100vh;display:grid;grid-template-columns:minmax(300px,410px) 1fr}
    aside{border-right:1px solid var(--line);padding:28px 28px 36px;position:sticky;top:0;height:100vh;overflow:auto;background:#0d0e10}
    main{padding:30px 3vw 60px;min-width:0}
    .eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.18em;color:#8d9097}
    h1{font-size:clamp(30px,3vw,48px);line-height:1;margin:10px 0 12px}
    .lead{color:#a9abb1;line-height:1.55;font-size:14px}
    .status{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0 26px}
    .badge{border:1px solid #383b41;border-radius:999px;padding:7px 10px;font-size:11px;color:#c7c9cd}
    .badge.derived{border-color:#6b5d42;color:#e5d2aa}
    label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:#8f9299;margin:15px 0 7px}
    select,input[type=range],button{width:100%}
    select{appearance:none;background:var(--panel);color:var(--text);border:1px solid var(--line);padding:12px;border-radius:10px;font-size:14px}
    input[type=range]{accent-color:#d2c09c}
    .range-line{display:grid;grid-template-columns:1fr 54px;gap:12px;align-items:center}
    .value{border:1px solid var(--line);background:var(--soft);border-radius:8px;text-align:center;padding:8px 4px;font-size:12px;color:#c8c9cd}
    .actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:22px}
    button,.button{border:1px solid #44474e;background:#17191d;color:#fff;border-radius:10px;padding:12px 14px;cursor:pointer;text-decoration:none;text-align:center;font-size:13px}
    button.primary{background:#eee9df;color:#111;border-color:#eee9df}
    button:hover,.button:hover{filter:brightness(1.08)}
    .topbar{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;margin-bottom:18px}
    .topbar .links{display:flex;gap:8px;flex-wrap:wrap}
    .stage{background:#101114;border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:0 30px 90px #0008}
    .canvas-wrap{aspect-ratio:1/1;width:min(100%,980px);margin:0 auto;background:#08090a;border-radius:10px;overflow:hidden;display:flex;align-items:center;justify-content:center}
    canvas{width:100%;height:100%;display:block}
    .recipe{margin-top:18px;display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:16px}
    pre{margin:0;background:#0f1012;border:1px solid var(--line);border-radius:12px;padding:16px;overflow:auto;color:#bfc2c8;font-size:11px;line-height:1.55;min-height:160px}
    .source-card{background:#0f1012;border:1px solid var(--line);border-radius:12px;padding:12px}
    .source-card img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:8px;background:#090a0b}
    .source-name{font-size:11px;color:#9da0a7;margin-top:10px;word-break:break-all}
    .note{font-size:11px;color:#777b83;line-height:1.5;margin-top:20px}
    .error{color:#e4b2aa}
    .mobile-nav-toggle,.panel-close,.panel-backdrop{display:none}
    @media(max-width:980px){
      body.controls-open{overflow:hidden}
      .shell{display:block}
      main{padding:76px 14px 36px}
      aside{
        position:fixed;z-index:60;left:0;top:0;bottom:0;width:min(88vw,390px);height:100dvh;
        border-right:1px solid var(--line);border-bottom:0;padding:64px 22px 30px;
        transform:translateX(-104%);transition:transform .24s ease;box-shadow:24px 0 70px #000b
      }
      body.controls-open aside{transform:translateX(0)}
      .mobile-nav-toggle{
        display:flex;position:fixed;z-index:50;left:14px;top:14px;width:auto;min-width:122px;
        align-items:center;justify-content:center;gap:8px;padding:11px 14px;background:#111318e8;
        border:1px solid #3c4048;backdrop-filter:blur(16px);box-shadow:0 8px 30px #0007
      }
      .mobile-nav-toggle::before{content:"☰";font-size:16px;line-height:1}
      .panel-close{
        display:block;position:absolute;right:16px;top:14px;width:42px;height:42px;padding:0;
        border-radius:50%;font-size:22px;line-height:1;background:#17191d
      }
      .panel-backdrop{
        display:block;position:fixed;z-index:55;inset:0;background:#0009;opacity:0;pointer-events:none;
        transition:opacity .24s ease
      }
      body.controls-open .panel-backdrop{opacity:1;pointer-events:auto}
      .recipe{grid-template-columns:1fr}
      .topbar{display:block;margin-bottom:12px}
      .topbar .links{margin-top:12px}
      .stage{padding:8px;border-radius:14px}
      .canvas-wrap{border-radius:8px}
    }
  </style>
</head>
<body>
<button class="mobile-nav-toggle" id="mobile-nav-toggle" type="button" aria-controls="controls-panel" aria-expanded="false">Параметры</button>
<div class="panel-backdrop" id="panel-backdrop" aria-hidden="true"></div>
<div class="shell">
  <aside id="controls-panel" aria-label="Параметры генератора">
    <button class="panel-close" id="panel-close" type="button" aria-label="Закрыть панель">×</button>
    <div class="eyebrow">TEREM Visual DNA · Generator v1</div>
    <h1>Pattern Laboratory</h1>
    <div class="lead">Автоматическая сборка новых орнаментальных композиций из принятой Visual DNA. Генератор не добавляет новые исторические символы и не меняет исходную палитру.</div>
    <div class="status">
      <span class="badge derived">DERIVED</span>
      <span class="badge">historical attribution: UNKNOWN</span>
      <span class="badge" id="asset-count">DNA loading…</span>
    </div>

    <label for="room">Помещение</label>
    <select id="room"></select>

    <label for="category">Категория DNA</label>
    <select id="category"></select>

    <label for="source">Исходный asset</label>
    <select id="source"></select>

    <label for="composition">Композиция</label>
    <select id="composition">
      <option value="rapport">Раппорт</option>
      <option value="mirror">Зеркальная система</option>
      <option value="half_drop">Полусдвиг</option>
      <option value="radial">Радиальная композиция</option>
      <option value="border">Бордюр / рама</option>
    </select>

    <label for="symmetry">Симметрия</label>
    <select id="symmetry">
      <option value="none">Без дополнительной</option>
      <option value="x">Зеркальная X</option>
      <option value="xy">Зеркальная X/Y</option>
    </select>

    <label for="density">Плотность</label>
    <div class="range-line"><input id="density" type="range" min="2" max="8" value="4"><div class="value" id="density-value">4</div></div>

    <label for="scale">Масштаб элемента</label>
    <div class="range-line"><input id="scale" type="range" min="65" max="180" value="100"><div class="value" id="scale-value">100%</div></div>

    <div class="actions">
      <button class="primary" id="generate">Сгенерировать</button>
      <button id="next">Другой asset</button>
      <button id="export">PNG</button>
      <button id="copy">Копировать рецепт</button>
    </div>
    <div class="note">v1 — rule-based compositor. Источник каждого результата сохраняется в recipe. Следующий слой системы — motif segmentation и параметрическое векторное построение.</div>
  </aside>

  <main>
    <div class="topbar">
      <div>
        <div class="eyebrow">SOURCE → DNA → RULES → GENERATE</div>
        <div class="lead" id="grammar-status">Visual Grammar loading…</div>
      </div>
      <div class="links">
        <a class="button" href="https://terem-visual-dna.kontrakevich.workers.dev/">DNA Library</a>
      </div>
    </div>

    <section class="stage">
      <div class="canvas-wrap"><canvas id="canvas" width="1024" height="1024"></canvas></div>
      <div class="recipe">
        <pre id="recipe"></pre>
        <div class="source-card">
          <img id="source-preview" alt="DNA source">
          <div class="source-name" id="source-name"></div>
        </div>
      </div>
    </section>
  </main>
</div>
<script>
(() => {
  const els = Object.fromEntries(["room","category","source","composition","symmetry","density","scale","generate","next","export","copy","canvas","recipe","source-preview","source-name","asset-count","grammar-status","density-value","scale-value","mobile-nav-toggle","panel-backdrop","panel-close"].map(id=>[id,document.getElementById(id)]));
  const ctx = els.canvas.getContext("2d");
  let cards = [], grammar = null, filtered = [], image = new Image();

  const uniq = xs => [...new Set(xs)].sort((a,b)=>a.localeCompare(b,"ru"));
  const option = (value,label=value) => { const o=document.createElement("option"); o.value=value; o.textContent=label; return o; };
  const centerCrop = img => {
    const s=Math.min(img.naturalWidth,img.naturalHeight);
    return {sx:(img.naturalWidth-s)/2,sy:(img.naturalHeight-s)/2,sw:s,sh:s};
  };
  function fillSelect(el,values,current){
    el.innerHTML="";
    values.forEach(v=>el.appendChild(option(v)));
    if(current && values.includes(current)) el.value=current;
  }
  function refreshCategories(){
    const current=els.category.value;
    fillSelect(els.category,uniq(cards.filter(c=>c.room===els.room.value).map(c=>c.section)),current);
    refreshSources();
  }
  function refreshSources(){
    const prev=els.source.value;
    filtered=cards.filter(c=>c.room===els.room.value && c.section===els.category.value);
    els.source.innerHTML="";
    filtered.forEach((c,i)=>els.source.appendChild(option(String(i),c.name)));
    if(filtered.some((c,i)=>String(i)===prev)) els.source.value=prev;
    loadSelected();
  }
  function asset(){
    return filtered[Number(els.source.value)||0] || filtered[0] || cards[0];
  }
  function loadSelected(){
    const a=asset();
    if(!a) return;
    image=new Image();
    image.onload=render;
    image.src="/source/"+a.full;
    els["source-preview"].src="/source/"+a.src;
    els["source-name"].textContent=a.name;
  }
  function drawTile(x,y,w,h,fx=false,fy=false){
    const c=centerCrop(image);
    ctx.save();
    ctx.translate(x+w/2,y+h/2);
    ctx.scale(fx?-1:1,fy?-1:1);
    ctx.drawImage(image,c.sx,c.sy,c.sw,c.sh,-w/2,-h/2,w,h);
    ctx.restore();
  }
  function drawGrid(mode){
    const density=Number(els.density.value);
    const scale=Number(els.scale.value)/100;
    const base=1024/density*scale;
    const rows=Math.ceil(1024/base)+2, cols=Math.ceil(1024/base)+2;
    for(let r=-1;r<rows;r++){
      const shift=(mode==="half_drop" && Math.abs(r)%2===1)?base/2:0;
      for(let c=-1;c<cols;c++){
        let fx=false,fy=false;
        if(mode==="mirror"){fx=Math.abs(c)%2===1;fy=Math.abs(r)%2===1}
        if(els.symmetry.value==="x") fx=Math.abs(c)%2===1;
        if(els.symmetry.value==="xy"){fx=Math.abs(c)%2===1;fy=Math.abs(r)%2===1}
        drawTile(c*base+shift,r*base,base,base,fx,fy);
      }
    }
  }
  function drawRadial(){
    const c=centerCrop(image), segments=Number(els.density.value)<=4?8:12;
    ctx.save();
    ctx.translate(512,512);
    for(let i=0;i<segments;i++){
      ctx.save();
      ctx.rotate(i*Math.PI*2/segments);
      ctx.beginPath();
      ctx.moveTo(0,0);
      ctx.arc(0,0,760,-Math.PI/segments,Math.PI/segments);
      ctx.closePath();ctx.clip();
      if(i%2) ctx.scale(-1,1);
      ctx.drawImage(image,c.sx,c.sy,c.sw,c.sh,-512,-512,1024,1024);
      ctx.restore();
    }
    ctx.restore();
  }
  function drawBorder(){
    const c=centerCrop(image);
    ctx.fillStyle="#11100e";ctx.fillRect(0,0,1024,1024);
    ctx.globalAlpha=.42;
    ctx.drawImage(image,c.sx,c.sy,c.sw,c.sh,190,190,644,644);
    ctx.globalAlpha=1;
    const n=Math.max(4,Number(els.density.value)+2), cell=1024/n, thick=Math.max(92,cell);
    for(let i=0;i<n;i++){
      const x=i*cell;
      drawTile(x,0,cell,thick,i%2===1,false);
      drawTile(x,1024-thick,cell,thick,i%2===1,true);
      const y=i*cell;
      drawTile(0,y,thick,cell,false,i%2===1);
      drawTile(1024-thick,y,thick,cell,true,i%2===1);
    }
  }
  function recipe(){
    const a=asset();
    return {
      project:"TEREM Visual DNA",
      generator:"Pattern Laboratory v1",
      fidelity:"DERIVED",
      historical_attribution:"UNKNOWN",
      source_asset:a?.name||null,
      source_room:a?.room||null,
      source_category:a?.section||null,
      composition:els.composition.value,
      symmetry:els.symmetry.value,
      density:Number(els.density.value),
      scale_percent:Number(els.scale.value),
      color_policy:"preserve source color",
      generated_at:new Date().toISOString()
    };
  }
  function render(){
    if(!image.complete || !image.naturalWidth) return;
    ctx.clearRect(0,0,1024,1024);
    const mode=els.composition.value;
    if(mode==="radial") drawRadial();
    else if(mode==="border") drawBorder();
    else drawGrid(mode);
    els.recipe.textContent=JSON.stringify(recipe(),null,2);
  }
  async function boot(){
    try{
      const [indexText,g]=await Promise.all([
        fetch("/library-index",{cache:"no-store"}).then(r=>r.text()),
        fetch("grammar.v1.json",{cache:"no-store"}).then(r=>r.json())
      ]);
      grammar=g;
      const doc=new DOMParser().parseFromString(indexText,"text/html");
      cards=[...doc.querySelectorAll(".card")].map(card=>{
        const img=card.querySelector("img");
        return {room:card.dataset.room,section:card.dataset.section,name:img.alt,src:img.getAttribute("src"),full:img.dataset.full};
      }).filter(c=>c.section!=="SOURCE" && c.full);
      els["asset-count"].textContent=cards.length+" accepted DNA views";
      els["grammar-status"].textContent="Visual Grammar v"+grammar.schema_version+" · fidelity contract active";
      fillSelect(els.room,uniq(cards.map(c=>c.room)));
      refreshCategories();
    }catch(err){
      els["grammar-status"].innerHTML='<span class="error">Pattern Laboratory bootstrap failed</span>';
      els.recipe.textContent=String(err);
    }
  }
  function setControlsOpen(open){
    document.body.classList.toggle("controls-open",open);
    els["mobile-nav-toggle"].setAttribute("aria-expanded",String(open));
  }
  els["mobile-nav-toggle"].addEventListener("click",()=>setControlsOpen(!document.body.classList.contains("controls-open")));
  els["panel-close"].addEventListener("click",()=>setControlsOpen(false));
  els["panel-backdrop"].addEventListener("click",()=>setControlsOpen(false));
  window.addEventListener("keydown",e=>{if(e.key==="Escape")setControlsOpen(false)});
  window.addEventListener("resize",()=>{if(window.innerWidth>980)setControlsOpen(false)});

  els.room.addEventListener("change",refreshCategories);
  els.category.addEventListener("change",refreshSources);
  els.source.addEventListener("change",loadSelected);
  els.composition.addEventListener("change",render);
  els.symmetry.addEventListener("change",render);
  els.density.addEventListener("input",()=>{els["density-value"].textContent=els.density.value;render()});
  els.scale.addEventListener("input",()=>{els["scale-value"].textContent=els.scale.value+"%";render()});
  els.generate.addEventListener("click",()=>{render();if(window.innerWidth<=980)setControlsOpen(false)});
  els.next.addEventListener("click",()=>{if(!filtered.length)return;els.source.value=String(((Number(els.source.value)||0)+1)%filtered.length);loadSelected()});
  els.export.addEventListener("click",()=>{const a=document.createElement("a");a.download="TEREM_DERIVED_PATTERN.png";a.href=els.canvas.toDataURL("image/png");a.click()});
  els.copy.addEventListener("click",async()=>{await navigator.clipboard.writeText(els.recipe.textContent);els.copy.textContent="Скопировано";setTimeout(()=>els.copy.textContent="Копировать рецепт",1200)});
  boot();
})();
</script>
</body>
</html>

