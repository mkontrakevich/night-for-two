name: TEREM Pattern Lab — Mobile Canary

on:
  push:
    branches: [main]
    paths:
      - "cloudflare/terem-pattern-lab-mobile/**"
      - ".github/workflows/terem-pattern-lab-mobile-canary.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: terem-pattern-lab-mobile-canary
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: cloudflare/terem-pattern-lab-mobile
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

    steps:
      - uses: actions/checkout@v4
      - name: Verify Cloudflare authorization
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_API_TOKEN"
      - name: Deploy canary
        run: npx --yes wrangler@4 deploy
      - name: Enable workers.dev route
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error             -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"             -H "Content-Type: application/json"             -X POST             "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/terem-pattern-lab-mobile/subdomain"             --data '{"enabled":true,"previews_enabled":false}' > /tmp/subdomain.json
          python -c "import json; d=json.load(open('/tmp/subdomain.json')); assert d.get('success') is True; assert (d.get('result') or {}).get('enabled') is True"

      - name: Verify canary
        shell: bash
        run: |
          set -u
          URL="https://terem-pattern-lab-mobile.kontrakevich.workers.dev"
          REPORT="$GITHUB_WORKSPACE/ops/terem-mobile-canary-report.txt"
          mkdir -p "$GITHUB_WORKSPACE/ops"
          : > "$REPORT"

          ROOT_HTTP="$(curl --silent --show-error --location --max-time 30 --output /tmp/lab.html --write-out '%{http_code}' "$URL/" || true)"
          echo "root_http=$ROOT_HTTP" | tee -a "$REPORT"
          if grep -q "Pattern Laboratory" /tmp/lab.html 2>/dev/null; then echo "root_pattern_lab=OK" | tee -a "$REPORT"; else echo "root_pattern_lab=FAILED" | tee -a "$REPORT"; fi
          if grep -q "mobile-nav-toggle" /tmp/lab.html 2>/dev/null; then echo "root_mobile_drawer=OK" | tee -a "$REPORT"; else echo "root_mobile_drawer=FAILED" | tee -a "$REPORT"; fi

          LIB_HTTP="$(curl --silent --show-error --location --max-time 30 --output /tmp/library.html --write-out '%{http_code}' "$URL/library-index" || true)"
          echo "library_http=$LIB_HTTP" | tee -a "$REPORT"
          if grep -q "TEREM Visual DNA" /tmp/library.html 2>/dev/null; then echo "library_content=OK" | tee -a "$REPORT"; else echo "library_content=FAILED" | tee -a "$REPORT"; fi

          GRAMMAR_HTTP="$(curl --silent --show-error --location --max-time 30 --output /tmp/grammar.json --write-out '%{http_code}' "$URL/grammar.v1.json" || true)"
          echo "grammar_http=$GRAMMAR_HTTP" | tee -a "$REPORT"
          if python -c "import json; d=json.load(open('/tmp/grammar.json')); assert d['pipeline']==['SOURCE','DNA','RULES','GENERATE']" 2>/dev/null; then echo "grammar_contract=OK" | tee -a "$REPORT"; else echo "grammar_contract=FAILED" | tee -a "$REPORT"; fi

          if grep -q '=FAILED' "$REPORT" || grep -Eq 'http=(000|4[0-9][0-9]|5[0-9][0-9])' "$REPORT"; then
            exit 1
          fi
          echo "TEREM_MOBILE_CANARY_OK" | tee -a "$REPORT"

      - name: Persist canary verification
        if: always()
        shell: bash
        working-directory: .
        run: |
          set -euo pipefail
          test -f ops/terem-mobile-canary-report.txt || exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ops/terem-mobile-canary-report.txt
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record TEREM mobile canary verification"
          git pull --rebase origin main
          git push origin HEAD:main
