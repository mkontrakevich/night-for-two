export default {
  async fetch(request, env) {
    const url = new URL(request.url);
    const base = "https://terem-visual-dna.kontrakevich.workers.dev";
    if (url.pathname === "/library-index") {
      const upstream = await fetch(base + "/index.html");
      return new Response(upstream.body, { status: upstream.status, headers: { "content-type": "text/html; charset=utf-8" } });
    }
    if (url.pathname.startsWith("/source/")) {
      const target = base + "/" + url.pathname.slice("/source/".length) + url.search;
      const upstream = await fetch(target);
      return new Response(upstream.body, { status: upstream.status, headers: upstream.headers });
    }
    return env.ASSETS.fetch(request);
  }
};

