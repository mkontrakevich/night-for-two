name: Novel 2 Clean CI

on:
  push:
    branches:
      - rebuild/novel-2-clean
    paths:
      - "novel2/**"
      - ".github/workflows/novel2-ci.yml"
  pull_request:
    paths:
      - "novel2/**"
      - ".github/workflows/novel2-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: novel2
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: npm install
      - name: Syntax
        run: |
          node --check src/app.js
          node --check src/auth.js
          node --check src/db.js
          node --check src/ai.js
          node --check src/prose-engine.js
          node --check src/identity-engine.js
          node --check src/character-builder.js
          node --check src/relationship-context.js
          node --check src/ai-character-library.js
          node --check src/visual-engine.js
      - run: npm test
      - name: Build container
        run: docker build -t novel2:ci .

  launch-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: launch_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --prefix novel2 --no-audit --no-fund
      - run: node novel2/scripts/story-launch.test.mjs
      - run: node novel2/scripts/story-launch-postgres.test.mjs
        env:
          NOVEL2_LAUNCH_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/launch_test
      - run: node novel2/scripts/pipeline-transaction.test.mjs
        env:
          NOVEL2_LAUNCH_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/launch_test
      - run: node --experimental-vm-modules novel2/scripts/story-launch-gateway.test.mjs


      - run: npm install --prefix novel2 --no-save --no-audit --no-fund playwright
      - run: |
          if ! command -v google-chrome; then
            cd novel2
            npx playwright install --with-deps chromium
          fi
      - run: node novel2/scripts/story-launch-browser.test.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: novel2-launch-recovery-ui
          path: /tmp/novel2-launch-qa
          if-no-files-found: ignore

