name: Novel 2 launch recovery
on:
  pull_request:
    paths: ['novel2/**', 'cloudflare/novel2-preview/**', '.github/workflows/novel2-launch-ci.yml']
  push:
    branches: [main]
    paths: ['novel2/**', 'cloudflare/novel2-preview/**', '.github/workflows/novel2-launch-ci.yml']
permissions:
  contents: read
jobs:
  launch-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: launch_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --prefix novel2 --no-audit --no-fund
      - run: node novel2/scripts/story-launch.test.mjs
      - run: node novel2/scripts/story-launch-postgres.test.mjs
        env:
          NOVEL2_LAUNCH_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/launch_test
      - run: node --experimental-vm-modules novel2/scripts/story-launch-gateway.test.mjs
