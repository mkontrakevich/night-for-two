name: Repair page 65 with SD skill

on:
  push:
    branches:
      - ops/repair-page65-sd-skill
    paths:
      - ".github/workflows/inspect-live-novel.yml"
      - "scripts/repair-page65-sd-temp.mjs"

permissions:
  contents: read

jobs:
  repair:
    runs-on: [self-hosted, windows, x64, marins-production]
    timeout-minutes: 30
    steps:
      - name: Checkout temporary repair
        uses: actions/checkout@v4

      - name: Verify production container
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $running = docker inspect -f '{{.State.Running}}' night-for-two-app-1
          if ($running -ne 'true') { throw "NIGHT_APP_NOT_RUNNING" }
          Invoke-RestMethod -Uri 'http://127.0.0.1:5681/night/health' -TimeoutSec 10 | ConvertTo-Json -Compress | Write-Host

      - name: Execute SD-guided page 65 repair
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          docker cp scripts/repair-page65-sd-temp.mjs night-for-two-app-1:/app/scripts/repair-page65-sd-temp.mjs
          if ($LASTEXITCODE -ne 0) { throw "PAGE65_COPY_FAILED:$LASTEXITCODE" }

          docker exec night-for-two-app-1 node scripts/repair-page65-sd-temp.mjs
          $repairExit = $LASTEXITCODE

          docker exec night-for-two-app-1 sh -lc 'rm -f /app/scripts/repair-page65-sd-temp.mjs'
          if ($repairExit -ne 0) { throw "PAGE65_REPAIR_FAILED:$repairExit" }
