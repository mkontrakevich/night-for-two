name: Inspect live novel generation

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/inspect-live-novel.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: [self-hosted, windows, x64, marins-production]
    timeout-minutes: 20
    steps:
      - name: Inspect live novel generation
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          Write-Host '=== CONTAINERS ==='
          docker ps --filter "name=night-for-two" --format "table {{.Names}}	{{.Status}}	{{.Ports}}"
          Write-Host '=== STATUS SCRIPT ==='
          docker exec night-for-two-app-1 node scripts/night-linear-novel-status.mjs
          Write-Host "status exit=$LASTEXITCODE"
          Write-Host '=== PROCESSES ==='
          docker top night-for-two-app-1
          Write-Host '=== RECENT GENERATOR LOGS ==='
          docker logs night-for-two-app-1 --since 20m 2>&1 | Select-String -Pattern 'NIGHT_LINEAR_|NIGHT_RELATIONSHIP_CONTEXT_READY|NIGHT_STORY_|ai_gateway|NOVEL|generation|OPENROUTER|failed|error' | Select-Object -Last 160 | ForEach-Object { $_.Line }

      - name: Repair test session 1 and prove Golden Path
        if: ${{ github.event_name == 'push' }}
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $script = @'
          import {createNightV2Runtime} from './src/night-for-two-v2-runtime.js';

          const SESSION_ID=1;
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          const asObject=v=>v&&typeof v==='object'?v:JSON.parse(String(v||'{}'));

          async function openRouterUsage(){
            try{
              const key=String(process.env.OPENROUTER_API_KEY||'');
              if(!key)return null;
              const response=await fetch('https://openrouter.ai/api/v1/key',{headers:{authorization:'Bearer '+key}});
              if(!response.ok)return null;
              const json=await response.json();
              const d=json?.data||json||{};
              const n=v=>Number.isFinite(Number(v))?Number(v):null;
              return {
                usage:n(d.usage),
                usage_daily:n(d.usage_daily),
                usage_weekly:n(d.usage_weekly),
                usage_monthly:n(d.usage_monthly),
                limit:n(d.limit),
                limit_remaining:n(d.limit_remaining)
              };
            }catch{return null;}
          }

          const usageBefore=await openRouterUsage();
          const owner=String(process.env.PRIMARY_OWNER_ID||'');
          if(!owner)throw new Error('GOLDEN_OWNER_ID_MISSING');

          let engine=createNightV2Runtime();
          await engine.init();

          const session=await engine.session(SESSION_ID);
          if(!session)throw new Error('GOLDEN_SESSION_1_MISSING');
          const beforeFlow=asObject(session.story_flow);
          const beforeScene=beforeFlow.scene||{};
          const players=await engine.players(SESSION_ID);
          const ownerPlayer=players.find(p=>String(p.telegram_user_id)===owner);
          const synthetic=players.find(p=>String(p.telegram_user_id).startsWith('-'));
          const otherReal=players.find(p=>String(p.telegram_user_id)!==owner&&!String(p.telegram_user_id).startsWith('-'));

          if(!ownerPlayer||ownerPlayer.role!=='A')throw new Error('GOLDEN_OWNER_ROLE_GUARD_FAILED');
          if(!synthetic||otherReal)throw new Error('GOLDEN_SYNTHETIC_ONLY_GUARD_FAILED');
          if(String(session.status)!=='story')throw new Error('GOLDEN_STATUS_GUARD_FAILED:'+String(session.status||''));
          if(Number(beforeFlow.stage||0)!==0)throw new Error('GOLDEN_STAGE_GUARD_FAILED:'+String(beforeFlow.stage||0));
          if(beforeScene?.title)throw new Error('GOLDEN_SCENE_ALREADY_READY');
          if(Boolean(beforeFlow.generating))throw new Error('GOLDEN_GENERATING_GUARD_FAILED');

          console.log('NIGHT_GOLDEN_SAFETY '+JSON.stringify({
            session_id:String(session.id),
            status:session.status,
            test_mode:true,
            synthetic_partner:true,
            stage:Number(beforeFlow.stage)||0,
            scene_ready:false
          }));

          const first=await engine.prepareStoryScene(SESSION_ID,{force:true});
          if(!first?.scene?.title)throw new Error('GOLDEN_FIRST_SCENE_FAILED');
          if(!Array.isArray(first.scene.options)||first.scene.options.length<2)throw new Error('GOLDEN_FIRST_OPTIONS_FAILED');
          if(!Array.isArray(first.scene.reader_pages)||first.scene.reader_pages.length<2)throw new Error('GOLDEN_FIRST_READER_FAILED');

          await engine.view(owner);
          let identityReady=false;
          for(let i=0;i<36;i++){
            const row=await engine.session(SESSION_ID);
            const flow=asObject(row.story_flow);
            const identity=flow.story_identity||{};
            identityReady=Boolean(identity?.world?.setting)&&Boolean(identity?.heroes?.A?.name)&&Boolean(identity?.heroes?.B?.name);
            if(identityReady)break;
            await sleep(2500);
          }
          if(!identityReady)throw new Error('GOLDEN_STORY_IDENTITY_FAILED');

          await engine.primeSyntheticStoryChoice(SESSION_ID);
          const primed=await engine.players(SESSION_ID);
          const syntheticPrimed=primed.find(p=>String(p.telegram_user_id).startsWith('-'));
          if(!syntheticPrimed?.story_submitted||!String(syntheticPrimed.story_choice||''))throw new Error('GOLDEN_SYNTHETIC_CHOICE_FAILED');

          const ownerChoice=String(first.scene.options[0]?.key||'');
          if(!ownerChoice)throw new Error('GOLDEN_OWNER_CHOICE_MISSING');
          await engine.submitStoryChoice({userId:owner,key:ownerChoice});
          await engine.advanceStory(SESSION_ID).catch(()=>null);

          let advancedFlow=null;
          for(let i=0;i<48;i++){
            const row=await engine.session(SESSION_ID);
            const flow=asObject(row.story_flow);
            if(Number(flow.stage)>=1&&flow.scene?.title&&!flow.generating){
              advancedFlow=flow;
              break;
            }
            await sleep(2500);
          }
          if(!advancedFlow)throw new Error('GOLDEN_NEXT_SCENE_TIMEOUT');
          if(Number(advancedFlow.stage)!==1)throw new Error('GOLDEN_NEXT_STAGE_INVALID:'+String(advancedFlow.stage));
          if(!Array.isArray(advancedFlow.scene?.reader_pages)||advancedFlow.scene.reader_pages.length<2)throw new Error('GOLDEN_NEXT_READER_FAILED');

          const lastHistory=Array.isArray(advancedFlow.history)?advancedFlow.history.at(-1):null;
          const causal=Array.isArray(lastHistory?.selected_actions)&&lastHistory.selected_actions.some(a=>a?.role==='A'&&String(a?.key||'')===ownerChoice);
          if(!causal)throw new Error('GOLDEN_CAUSAL_HISTORY_FAILED');

          const sceneKey='stage:'+String(advancedFlow.stage)+':'+String(advancedFlow.scene.title);
          await engine.saveReaderProgress({userId:owner,page:1,sceneKey});
          await engine.close();

          engine=createNightV2Runtime();
          await engine.init();
          const reopened=await engine.view(owner);
          if(Number(reopened.story_stage)!==1)throw new Error('GOLDEN_REOPEN_STAGE_FAILED:'+String(reopened.story_stage));
          if(Number(reopened.story_reader_progress)!==1)throw new Error('GOLDEN_REOPEN_PROGRESS_FAILED:'+String(reopened.story_reader_progress));
          const rel=await engine.relationshipContext();
          if(rel?.raw_messages!==false)throw new Error('GOLDEN_RAW_MESSAGES_POLICY_FAILED');
          await engine.close();

          const usageAfter=await openRouterUsage();
          const delta=(usageBefore?.usage!=null&&usageAfter?.usage!=null)?Math.max(0,usageAfter.usage-usageBefore.usage):null;

          console.log('NIGHT_GOLDEN_PATH_OK '+JSON.stringify({
            session_id:String(SESSION_ID),
            first_scene:true,
            story_identity:true,
            owner_choice:true,
            synthetic_choice:true,
            next_scene:true,
            causal_history:true,
            reader_progress_saved:true,
            reader_progress_reopened:true,
            relationship_raw_messages:false,
            openrouter_usage_delta:delta,
            openrouter_usage_daily:usageAfter?.usage_daily??null,
            openrouter_usage_monthly:usageAfter?.usage_monthly??null
          }));
          '@
          $script | docker exec -i night-for-two-app-1 node --input-type=module
          if ($LASTEXITCODE -ne 0) {
            docker logs night-for-two-app-1 --since 15m 2>&1 | Select-String -Pattern 'NIGHT_STORY_|OPENROUTER|failed|error' | Select-Object -Last 120 | ForEach-Object { $_.Line }
            throw "NIGHT_GOLDEN_PATH_REPAIR_FAILED:$LASTEXITCODE"
          }

      - name: Repair failed illustration page 65
        if: ${{ github.event_name == 'push' }}
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $preflight = @'
          const pg=require('pg');
          const pool=new pg.Pool({connectionString:process.env.DATABASE_URL,max:1});
          (async()=>{
            const n=(await pool.query("SELECT id,status,generated_pages,total_pages FROM night_linear_novels WHERE id=5")).rows[0];
            const p=(await pool.query("SELECT page_no,image_status,length(media_prompt) AS prompt_length FROM night_linear_novel_pages WHERE novel_id=5 AND page_no=65")).rows[0];
            if(!n||Number(n.generated_pages)!==Number(n.total_pages)||Number(n.total_pages)!==100)throw new Error('IMAGE65_NOVEL_GUARD_FAILED');
            if(!p||String(p.image_status)!=='failed'||Number(p.prompt_length||0)<=0)throw new Error('IMAGE65_PAGE_GUARD_FAILED');
            await pool.query("UPDATE night_linear_novels SET status='illustrating',error='',updated_at=now() WHERE id=5");
            console.log('NIGHT_IMAGE65_REPAIR_ARMED '+JSON.stringify({novel_id:'5',page_no:65,previous_status:p.image_status}));
          })().catch(e=>{console.error(e.message);process.exitCode=1}).finally(()=>pool.end());
          '@
          $preflight | docker exec -i night-for-two-app-1 node
          if ($LASTEXITCODE -ne 0) { throw "NIGHT_IMAGE65_PREFLIGHT_FAILED:$LASTEXITCODE" }

          docker exec -e NIGHT_RESUME_NOVEL_ID=5 night-for-two-app-1 node scripts/night-generate-linear-novel.mjs
          $generationExit=$LASTEXITCODE

          $verify = @'
          const pg=require('pg');
          const pool=new pg.Pool({connectionString:process.env.DATABASE_URL,max:1});
          (async()=>{
            const n=(await pool.query("SELECT id,status,generated_pages,total_pages,generated_images,error FROM night_linear_novels WHERE id=5")).rows[0];
            const p=(await pool.query("SELECT page_no,image_status FROM night_linear_novel_pages WHERE novel_id=5 AND page_no=65")).rows[0];
            const stats=(await pool.query("SELECT count(*) FILTER (WHERE media_prompt<>'' AND image_status='ready')::int AS ready,count(*) FILTER (WHERE media_prompt<>'')::int AS planned,count(*) FILTER (WHERE media_prompt<>'' AND image_status='failed')::int AS failed FROM night_linear_novel_pages WHERE novel_id=5")).rows[0];
            const ok=String(n?.status)==='complete'&&String(p?.image_status)==='ready'&&Number(stats?.ready)===Number(stats?.planned)&&Number(stats?.failed)===0;
            if(!ok){
              await pool.query("UPDATE night_linear_novels SET status='complete',error='NIGHT_LINEAR_ILLUSTRATIONS_PENDING:1',updated_at=now() WHERE id=5 AND generated_pages>=total_pages");
            }
            console.log('NIGHT_IMAGE65_REPAIR_RESULT '+JSON.stringify({
              ok,
              novel_status:String(n?.status||''),
              page65_status:String(p?.image_status||''),
              ready:Number(stats?.ready)||0,
              planned:Number(stats?.planned)||0,
              failed:Number(stats?.failed)||0
            }));
            if(!ok)process.exitCode=2;
          })().catch(e=>{console.error(e.message);process.exitCode=1}).finally(()=>pool.end());
          '@
          $verify | docker exec -i night-for-two-app-1 node
          $verifyExit=$LASTEXITCODE
          if ($generationExit -ne 0 -or $verifyExit -ne 0) {
            throw "NIGHT_IMAGE65_REPAIR_FAILED:generation=$generationExit verify=$verifyExit"
          }

      - name: Read-only Interactive Novel state gate
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $script = @'
          const pg=require('pg');
          const pool=new pg.Pool({connectionString:process.env.DATABASE_URL,max:1});
          (async()=>{
            const owner=String(process.env.PRIMARY_OWNER_ID||'');
            if(!owner)throw new Error('OWNER_ID_MISSING');
            const active=await pool.query(
              "SELECT s.id,s.status,s.connection_verified_at,s.story_flow,p.role FROM night_v2_players p JOIN night_v2_sessions s ON s.id=p.session_id WHERE p.telegram_user_id=$1 AND p.active=true AND s.status<>'ended' ORDER BY s.id DESC LIMIT 1",
              [owner]
            );
            if(!active.rowCount){
              console.log('NIGHT_INTERACTIVE_GATE '+JSON.stringify({active_session:false}));
            }else{
              const row=active.rows[0],flow=row.story_flow||{},scene=flow.scene||{},identity=flow.story_identity||{};
              const players=await pool.query("SELECT role,telegram_user_id,story_submitted,reader_page FROM night_v2_players WHERE session_id=$1 AND active=true ORDER BY role",[row.id]);
              console.log('NIGHT_INTERACTIVE_GATE '+JSON.stringify({
                active_session:true,
                session_id:String(row.id),
                status:row.status,
                role:row.role,
                partner_connected:players.rowCount===2,
                test_mode:players.rows.some(x=>String(x.telegram_user_id).startsWith('-')),
                connection_verified:Boolean(row.connection_verified_at),
                story_stage:Number(flow.stage)||0,
                generating:Boolean(flow.generating),
                generation_phase:String(flow.generation_phase||''),
                scene_ready:Boolean(scene.title),
                scene_final:Boolean(scene.final),
                options:Array.isArray(scene.options)?scene.options.length:0,
                reader_pages:Array.isArray(scene.reader_pages)?scene.reader_pages.length:0,
                identity_world:Boolean(identity?.world?.setting),
                identity_a:Boolean(identity?.heroes?.A?.name),
                identity_b:Boolean(identity?.heroes?.B?.name),
                owner_story_submitted:Boolean(players.rows.find(x=>x.role==='A')?.story_submitted),
                owner_reader_page:Number(players.rows.find(x=>x.role==='A')?.reader_page)||0
              }));
            }

            const latest=await pool.query("SELECT id,title,status,generated_pages,total_pages,generated_images,error FROM night_linear_novels ORDER BY id DESC LIMIT 1");
            const novel=latest.rows[0]||null;
            if(!novel){
              console.log('NIGHT_VISUAL_GATE '+JSON.stringify({novel:null,not_ready:[]}));
            }else{
              const q=await pool.query(
                "SELECT page_no,image_status,visual_key,length(media_prompt) AS prompt_length FROM night_linear_novel_pages WHERE novel_id=$1 AND media_prompt<>'' AND image_status<>'ready' ORDER BY page_no",
                [novel.id]
              );
              console.log('NIGHT_VISUAL_GATE '+JSON.stringify({
                novel_id:String(novel.id),
                novel_status:novel.status,
                generated_pages:Number(novel.generated_pages)||0,
                total_pages:Number(novel.total_pages)||0,
                generated_images:Number(novel.generated_images)||0,
                error:String(novel.error||''),
                not_ready:q.rows.map(x=>({
                  page_no:Number(x.page_no),
                  image_status:x.image_status,
                  visual_key:x.visual_key,
                  prompt_length:Number(x.prompt_length)||0
                }))
              }));
            }
          })().catch(e=>{console.error('NIGHT_READ_ONLY_GATE_FAILED '+e.message);process.exitCode=1}).finally(()=>pool.end());
          '@
          $script | docker exec -i night-for-two-app-1 node
          if ($LASTEXITCODE -ne 0) { throw "NIGHT_READ_ONLY_GATE_FAILED:$LASTEXITCODE" }
