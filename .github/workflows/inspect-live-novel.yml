name: Inspect live novel generation

on:
  workflow_dispatch:
  push:
    branches: [main, ops/repair-linear-page-65-sd-skill]
    paths:
      - ".github/workflows/inspect-live-novel.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: [self-hosted, windows, x64, marins-production]
    timeout-minutes: 30
    steps:
      - name: Inspect live novel generation
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          Write-Host '=== CONTAINERS ==='
          docker ps --filter "name=night-for-two" --format "table {{.Names}}	{{.Status}}	{{.Ports}}"
          Write-Host '=== STATUS SCRIPT ==='
          docker exec night-for-two-app-1 node scripts/night-linear-novel-status.mjs
          Write-Host "status exit=$LASTEXITCODE"
          Write-Host '=== PROCESSES ==='
          docker top night-for-two-app-1
          Write-Host '=== RECENT GENERATOR LOGS ==='
          docker logs night-for-two-app-1 --since 20m 2>&1 | Select-String -Pattern 'NIGHT_LINEAR_|NIGHT_RELATIONSHIP_CONTEXT_READY|NIGHT_STORY_|ai_gateway|NOVEL|generation|OPENROUTER|failed|error' | Select-Object -Last 160 | ForEach-Object { $_.Line }

      - name: Repair linear novel page 65 with SD + Character Identity skills
        if: ${{ github.ref == 'refs/heads/ops/repair-linear-page-65-sd-skill' }}
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          $prepare = @'
          import fs from 'node:fs/promises';
          import pg from 'pg';
          import {completeAIText} from './src/ai/provider-router.js';

          const {Pool}=pg;
          const pool=new Pool({connectionString:process.env.DATABASE_URL,max:1});
          const NOVEL_ID=5,PAGE_NO=65;
          const clean=(v='',n=6000)=>String(v||'').replace(/\r/g,'').trim().slice(0,n);

          async function usage(){
            try{
              const key=String(process.env.OPENROUTER_API_KEY||'');
              if(!key)return null;
              const r=await fetch('https://openrouter.ai/api/v1/key',{headers:{authorization:'Bearer '+key}});
              if(!r.ok)return null;
              const j=await r.json(),d=j?.data||j||{};
              const n=v=>Number.isFinite(Number(v))?Number(v):null;
              return {usage:n(d.usage),daily:n(d.usage_daily),monthly:n(d.usage_monthly)};
            }catch{return null;}
          }

          try{
            const before=await usage();
            const {rows:nrows}=await pool.query(
              "SELECT id,title,status,generated_pages,total_pages,generated_images,plan,error FROM night_linear_novels WHERE id=$1",
              [NOVEL_ID]
            );
            const novel=nrows[0];
            if(!novel)throw new Error('PAGE65_NOVEL_MISSING');
            if(Number(novel.generated_pages)!==100||Number(novel.total_pages)!==100)throw new Error('PAGE65_TEXT_NOT_COMPLETE');
            if(String(novel.status)!=='complete')throw new Error('PAGE65_NOVEL_STATUS_GUARD:'+String(novel.status));

            const {rows:bad}=await pool.query(
              "SELECT page_no,image_status FROM night_linear_novel_pages WHERE novel_id=$1 AND BTRIM(media_prompt)<>'' AND image_status<>'ready' ORDER BY page_no",
              [NOVEL_ID]
            );
            if(bad.length!==1||Number(bad[0].page_no)!==PAGE_NO||String(bad[0].image_status)!=='failed'){
              throw new Error('PAGE65_SINGLE_FAILURE_GUARD:'+JSON.stringify(bad));
            }

            const {rows:prows}=await pool.query(
              "SELECT page_no,chapter_no,chapter_title,page_title,body,media_prompt,visual_key,image_status FROM night_linear_novel_pages WHERE novel_id=$1 AND page_no BETWEEN $2 AND $3 ORDER BY page_no",
              [NOVEL_ID,PAGE_NO-1,PAGE_NO+1]
            );
            const page=prows.find(x=>Number(x.page_no)===PAGE_NO);
            if(!page)throw new Error('PAGE65_PAGE_MISSING');

            const [sdSkill,characterSkill]=await Promise.all([
              fs.readFile('./skills/sd-story-illustration/SKILL.md','utf8'),
              fs.readFile('./skills/real-couple-character-identity/SKILL.md','utf8')
            ]);
            const plan=novel.plan||{};

            const raw=await completeAIText({
              contour:'wife',
              requestName:'night_linear_page65_visual_prompt_repair',
              skipDatabaseContext:true,
              temperature:.32,
              maxTokens:1800,
              messages:[
                {role:'system',content:`You are the visual prompt director for a cinematic illustrated novel. Rebuild ONE production image prompt from the exact page prose and the two canonical visual skills supplied by the application.

Follow this block order exactly:
SHOT TYPE
→ STORY / ACTION
→ BODY LANGUAGE / SUBJECT SCALE
→ EMOTION / ATMOSPHERE
→ WARDROBE / PROPS / TEXTURES
→ ENVIRONMENT
→ LIGHT / TIME
→ CAMERA / LENS
→ COLOR / FILM CHARACTER
→ IDENTITY LOCK
→ CONTINUITY LOCK

Rules:
- The page prose is canonical. Do not invent a different action, room, prop, garment, character position, time or emotional beat.
- Use fictional character identity information from NOVEL_PLAN only. Do not infer or include sensitive real-player traits or direct identifiers.
- Preserve character A/B separation, relative scale, wardrobe/prop ownership and prior-page continuity.
- Create a premium vertical 9:16 editorial/cinematic still.
- Keep sensuality non-explicit: no visible genitals, no visible nipples, no sexual act, no pornographic framing.
- No text, logo or watermark in the image.
- Output JSON only: {"media_prompt":"..."}.

SD STORY ILLUSTRATION SKILL:
${clean(sdSkill,9000)}

CHARACTER IDENTITY SKILL:
${clean(characterSkill,9000)}`},
                {role:'user',content:JSON.stringify({
                  NOVEL_TITLE:novel.title,
                  NOVEL_PLAN:{
                    protagonists:plan.protagonists||[],
                    world_bible:plan.world_bible||{},
                    style_bible:plan.style_bible||{},
                    master_plot:plan.master_plot||{}
                  },
                  PREVIOUS_PAGE:prows.find(x=>Number(x.page_no)===PAGE_NO-1)||null,
                  TARGET_PAGE:{
                    page_no:page.page_no,
                    chapter_no:page.chapter_no,
                    chapter_title:page.chapter_title,
                    page_title:page.page_title,
                    body:page.body,
                    previous_media_prompt:page.media_prompt
                  },
                  NEXT_PAGE:prows.find(x=>Number(x.page_no)===PAGE_NO+1)||null
                })}
              ]
            });

            const text=String(raw||'').trim().replace(/^```(?:json)?\s*|\s*```$/g,'');
            let parsed;
            try{parsed=JSON.parse(text)}catch{
              const a=text.indexOf('{'),b=text.lastIndexOf('}');
              if(a<0||b<=a)throw new Error('PAGE65_PROMPT_JSON_INVALID');
              parsed=JSON.parse(text.slice(a,b+1));
            }
            const prompt=clean(parsed?.media_prompt,5000);
            if(prompt.length<700)throw new Error('PAGE65_PROMPT_TOO_SHORT:'+prompt.length);
            const order=['SHOT','STORY','BODY','EMOTION','WARDROBE','ENVIRONMENT','LIGHT','CAMERA','COLOR','IDENTITY','CONTINUITY'];
            const upper=prompt.toUpperCase();
            let last=-1;
            for(const marker of order){
              const idx=upper.indexOf(marker);
              if(idx<=last)throw new Error('PAGE65_PROMPT_ORDER_INVALID:'+marker);
              last=idx;
            }

            await pool.query("UPDATE night_linear_novel_pages SET media_prompt=$3,image_status='planned',updated_at=now() WHERE novel_id=$1 AND page_no=$2",[NOVEL_ID,PAGE_NO,prompt]);
            await pool.query("UPDATE night_linear_novels SET status='illustrating',error='',updated_at=now() WHERE id=$1",[NOVEL_ID]);

            console.log('NIGHT_PAGE65_PROMPT_REBUILT '+JSON.stringify({
              novel_id:String(NOVEL_ID),
              page_no:PAGE_NO,
              prompt_length:prompt.length,
              sd_skill:true,
              character_identity_skill:true,
              openrouter_usage_before:before?.usage??null
            }));
          }finally{
            await pool.end().catch(()=>{});
          }
          '@

          $prepare | docker exec -i night-for-two-app-1 node --input-type=module -
          if ($LASTEXITCODE -ne 0) { throw "NIGHT_PAGE65_PROMPT_REBUILD_FAILED:$LASTEXITCODE" }

          docker exec -e NIGHT_RESUME_NOVEL_ID=5 night-for-two-app-1 node scripts/night-generate-linear-novel.mjs
          $generationExit=$LASTEXITCODE

          $verify = @'
          import fs from 'node:fs/promises';
          import pg from 'pg';

          const {Pool}=pg;
          const pool=new Pool({connectionString:process.env.DATABASE_URL,max:1});

          async function usage(){
            try{
              const key=String(process.env.OPENROUTER_API_KEY||'');
              if(!key)return null;
              const r=await fetch('https://openrouter.ai/api/v1/key',{headers:{authorization:'Bearer '+key}});
              if(!r.ok)return null;
              const j=await r.json(),d=j?.data||j||{};
              const n=v=>Number.isFinite(Number(v))?Number(v):null;
              return {usage:n(d.usage),daily:n(d.usage_daily),monthly:n(d.usage_monthly)};
            }catch{return null;}
          }

          try{
            const {rows:nrows}=await pool.query("SELECT id,status,generated_pages,total_pages,generated_images,error FROM night_linear_novels WHERE id=5");
            const novel=nrows[0]||{};
            const {rows:statsRows}=await pool.query(
              "SELECT count(*) FILTER (WHERE BTRIM(media_prompt)<>'' AND image_status='ready')::int AS ready,count(*) FILTER (WHERE BTRIM(media_prompt)<>'')::int AS planned,count(*) FILTER (WHERE BTRIM(media_prompt)<>'' AND image_status='failed')::int AS failed FROM night_linear_novel_pages WHERE novel_id=5"
            );
            const stats=statsRows[0]||{};
            const {rows:pageRows}=await pool.query("SELECT page_no,image_status,visual_key,length(media_prompt) AS prompt_length FROM night_linear_novel_pages WHERE novel_id=5 AND page_no=65");
            const page=pageRows[0]||{};
            const metaPath=String(process.env.NIGHT_VISUAL_CACHE_DIR||'/app/config/night-visuals')+'/linear-novel-5-page-065.json';
            let meta=null;
            try{meta=JSON.parse(await fs.readFile(metaPath,'utf8'));}catch{}
            const u=await usage();
            const ok=String(novel.status)==='complete'
              && Number(stats.ready)===20
              && Number(stats.planned)===20
              && Number(stats.failed)===0
              && String(page.image_status)==='ready'
              && Boolean(meta?.qa?.passed);

            console.log('NIGHT_PAGE65_REPAIR_RESULT '+JSON.stringify({
              ok,
              novel_status:String(novel.status||''),
              page65_status:String(page.image_status||''),
              ready:Number(stats.ready)||0,
              planned:Number(stats.planned)||0,
              failed:Number(stats.failed)||0,
              prompt_length:Number(page.prompt_length)||0,
              qa_passed:Boolean(meta?.qa?.passed),
              qa_score:Number(meta?.qa?.score)||null,
              qa_model:String(meta?.qa?.model||''),
              image_model:String(meta?.model||''),
              openrouter_usage_after:u?.usage??null,
              openrouter_usage_daily:u?.daily??null,
              openrouter_usage_monthly:u?.monthly??null
            }));
            if(!ok)process.exitCode=2;
          }finally{
            await pool.end().catch(()=>{});
          }
          '@

          $verify | docker exec -i night-for-two-app-1 node --input-type=module -
          $verifyExit=$LASTEXITCODE
          if ($generationExit -ne 0 -or $verifyExit -ne 0) {
            throw "NIGHT_PAGE65_REPAIR_FAILED:generation=$generationExit verify=$verifyExit"
          }

      - name: Read-only Interactive Novel state gate
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $script = @'
          const pg=require('pg');
          const pool=new pg.Pool({connectionString:process.env.DATABASE_URL,max:1});
          (async()=>{
            const owner=String(process.env.PRIMARY_OWNER_ID||'');
            if(!owner)throw new Error('OWNER_ID_MISSING');
            const active=await pool.query(
              "SELECT s.id,s.status,s.connection_verified_at,s.story_flow,p.role FROM night_v2_players p JOIN night_v2_sessions s ON s.id=p.session_id WHERE p.telegram_user_id=$1 AND p.active=true AND s.status<>'ended' ORDER BY s.id DESC LIMIT 1",
              [owner]
            );
            if(!active.rowCount){
              console.log('NIGHT_INTERACTIVE_GATE '+JSON.stringify({active_session:false}));
            }else{
              const row=active.rows[0],flow=row.story_flow||{},scene=flow.scene||{},identity=flow.story_identity||{};
              const players=await pool.query("SELECT role,telegram_user_id,story_submitted,reader_page FROM night_v2_players WHERE session_id=$1 AND active=true ORDER BY role",[row.id]);
              console.log('NIGHT_INTERACTIVE_GATE '+JSON.stringify({
                active_session:true,
                session_id:String(row.id),
                status:row.status,
                role:row.role,
                partner_connected:players.rowCount===2,
                test_mode:players.rows.some(x=>String(x.telegram_user_id).startsWith('-')),
                connection_verified:Boolean(row.connection_verified_at),
                story_stage:Number(flow.stage)||0,
                generating:Boolean(flow.generating),
                generation_phase:String(flow.generation_phase||''),
                scene_ready:Boolean(scene.title),
                scene_final:Boolean(scene.final),
                options:Array.isArray(scene.options)?scene.options.length:0,
                reader_pages:Array.isArray(scene.reader_pages)?scene.reader_pages.length:0,
                identity_world:Boolean(identity?.world?.setting),
                identity_a:Boolean(identity?.heroes?.A?.name),
                identity_b:Boolean(identity?.heroes?.B?.name),
                owner_story_submitted:Boolean(players.rows.find(x=>x.role==='A')?.story_submitted),
                owner_reader_page:Number(players.rows.find(x=>x.role==='A')?.reader_page)||0
              }));
            }

            const latest=await pool.query("SELECT id,title,status,generated_pages,total_pages,generated_images,error FROM night_linear_novels ORDER BY id DESC LIMIT 1");
            const novel=latest.rows[0]||null;
            if(!novel){
              console.log('NIGHT_VISUAL_GATE '+JSON.stringify({novel:null,not_ready:[]}));
            }else{
              const q=await pool.query(
                "SELECT page_no,image_status,visual_key,length(media_prompt) AS prompt_length FROM night_linear_novel_pages WHERE novel_id=$1 AND media_prompt<>'' AND image_status<>'ready' ORDER BY page_no",
                [novel.id]
              );
              console.log('NIGHT_VISUAL_GATE '+JSON.stringify({
                novel_id:String(novel.id),
                novel_status:novel.status,
                generated_pages:Number(novel.generated_pages)||0,
                total_pages:Number(novel.total_pages)||0,
                generated_images:Number(novel.generated_images)||0,
                error:String(novel.error||''),
                not_ready:q.rows.map(x=>({
                  page_no:Number(x.page_no),
                  image_status:x.image_status,
                  visual_key:x.visual_key,
                  prompt_length:Number(x.prompt_length)||0
                }))
              }));
            }
          })().catch(e=>{console.error('NIGHT_READ_ONLY_GATE_FAILED '+e.message);process.exitCode=1}).finally(()=>pool.end());
          '@
          $script | docker exec -i night-for-two-app-1 node
          if ($LASTEXITCODE -ne 0) { throw "NIGHT_READ_ONLY_GATE_FAILED:$LASTEXITCODE" }
