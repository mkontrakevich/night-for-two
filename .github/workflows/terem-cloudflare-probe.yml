name: TEREM Visual DNA — Probe Recovered Worker

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/terem-cloudflare-probe.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      SCRIPT_NAME: terem-visual-dna

    steps:
      - uses: actions/checkout@v4

      - name: Probe TEREM Worker
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ops
          REPORT="ops/terem-cloudflare-probe-result.txt"
          : > "$REPORT"
          report(){ printf '%s\n' "$1" | tee -a "$REPORT"; }

          [[ -n "${CF_ACCOUNT:-}" ]] || { report "cloudflare_account_id=MISSING"; exit 1; }
          [[ -n "${CF_TOKEN:-}" ]] || { report "cloudflare_api_token=MISSING"; exit 1; }
          echo "::add-mask::$CF_ACCOUNT"
          echo "::add-mask::$CF_TOKEN"

          API="https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT"
          AUTH=(-H "Authorization: Bearer $CF_TOKEN")

          curl --fail --silent --show-error "${AUTH[@]}" "$API/workers/subdomain" > /tmp/account.json
          SUBDOMAIN="$(python - <<'PY'
import json
d=json.load(open('/tmp/account.json',encoding='utf-8'))
print((d.get('result') or {}).get('subdomain',''))
PY
)"
          report "workers_subdomain=$SUBDOMAIN"
          URL="https://$SCRIPT_NAME.$SUBDOMAIN.workers.dev"
          report "public_url=$URL"

          curl --fail --silent --show-error "${AUTH[@]}" "$API/workers/scripts/$SCRIPT_NAME/subdomain" > /tmp/script-subdomain.json
          python - <<'PY' >> "$REPORT"
import json
d=json.load(open('/tmp/script-subdomain.json',encoding='utf-8'))
r=d.get('result') or {}
print("workers_dev_enabled="+str(bool(r.get('enabled'))).lower())
print("previews_enabled="+str(bool(r.get('previews_enabled'))).lower())
PY

          HTTP="$(curl --silent --show-error --location --max-time 30 --output /tmp/page.html --write-out '%{http_code}' "$URL" || true)"
          report "public_http=$HTTP"
          if [[ "$HTTP" == "200" ]] && grep -q "TEREM Visual DNA" /tmp/page.html; then
            report "public_content=OK"
          else
            report "public_content=FAILED"
          fi

      - name: Persist safe probe report
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          [[ -f ops/terem-cloudflare-probe-result.txt ]] || exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ops/terem-cloudflare-probe-result.txt
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record TEREM Cloudflare probe"
          git pull --rebase origin main
          git push origin HEAD:main
