name: Inspect active Night Worker delivery

on:
  push:
    branches: [main]
    paths: [.github/workflows/inspect-night-live-20260929.yml]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_TUNNEL_ID: ${{ secrets.CLOUDFLARE_TUNNEL_ID }}
    steps:
      - name: Inspect version traffic and binding identity without secret values
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, ipaddress, urllib.request, urllib.error
          account=os.environ['CLOUDFLARE_ACCOUNT_ID']; token=os.environ['CLOUDFLARE_API_TOKEN']
          root=f'https://api.cloudflare.com/client/v4/accounts/{account}'
          def get(path):
              req=urllib.request.Request(root+path,headers={'Authorization':'Bearer '+token})
              with urllib.request.urlopen(req,timeout=25) as response: data=json.load(response)
              if not data.get('success'): raise RuntimeError('Cloudflare API unsuccessful: '+path)
              return data['result']
          deployments=get('/workers/scripts/night42/deployments')
          records=deployments.get('deployments',deployments.get('items',[])) if isinstance(deployments,dict) else deployments
          print('Deployment count:',len(records))
          for item in records[:5]:
              print('Deployment:',item.get('id'),item.get('created_on'),item.get('source'),'annotations:',item.get('annotations'))
              print('Traffic versions:',[(v.get('version_id'),v.get('percentage')) for v in item.get('versions',[])])
          versions=get('/workers/scripts/night42/versions?per_page=10')
          items=versions.get('items',versions) if isinstance(versions,dict) else versions
          print('Recent version IDs:',[v.get('id') for v in items[:8]])
          print('Recent version metadata:',[(v.get('id'),v.get('metadata'),v.get('annotations')) for v in items[:4]])
          req=urllib.request.Request(root+'/workers/scripts/night42',headers={'Authorization':'Bearer '+token})
          with urllib.request.urlopen(req,timeout=25) as response: script=response.read()
          print('Current script includes Reader proxy:',b'READER_ORIGIN' in script,'bytes:',len(script))
          for version_id in [v.get('version_id') for v in records[0].get('versions',[])] if records else []:
              obj=get('/workers/scripts/night42/versions/'+version_id)
              bindings=(obj.get('resources') or {}).get('bindings',obj.get('bindings',[]))
              print('Active version:',version_id,'binding names/types:',[(b.get('name'),b.get('type')) for b in bindings])
              vpc=next((b for b in bindings if b.get('name')=='NIGHT_VPC'),{})
              host=next((b for b in bindings if b.get('name')=='NIGHT_ORIGIN_HOST'),{})
              port=next((b for b in bindings if b.get('name')=='NIGHT_ORIGIN_PORT'),{})
              print('Tunnel matches configured secret:',vpc.get('tunnel_id')==os.environ['CLOUDFLARE_TUNNEL_ID'])
              print('Host binding present:',bool(host.get('text')),'port:',port.get('text'))
              baseline=get('/workers/scripts/night42/versions/45bb34f4-a2cf-4fa1-9ce7-f57eedfd5f95')
              bb=(baseline.get('resources') or {}).get('bindings',[])
              bhost=next((b.get('text') for b in bb if b.get('name')=='NIGHT_ORIGIN_HOST'),'')
              print('Active host matches baseline:',host.get('text')==bhost)
              target=host.get('text','')
              try: ip=ipaddress.ip_address(target); print('Host is IP:',True)
              except ValueError: ip=None; print('Host is IP:',False)
              for path,field in [('/teamnet/routes','network'),('/zerotrust/routes/hostname','hostname')]:
                  try:
                      obj=get(path)
                      routes=obj.get('result',obj.get('routes',obj.get('items',[]))) if isinstance(obj,dict) else obj
                      matches=[]
                      for route in routes:
                          if route.get('deleted_at'): continue
                          if field=='network' and ip:
                              try: same=ip in ipaddress.ip_network(route.get(field,''),strict=False)
                              except ValueError: same=False
                          else: same=route.get(field,'').lower()==target.lower()
                          if same: matches.append(route)
                      print('Route family:',field,'active count:',sum(not x.get('deleted_at') for x in routes),'target matches:',len(matches),'matching tunnel:',any(x.get('tunnel_id')==os.environ['CLOUDFLARE_TUNNEL_ID'] for x in matches))
                  except (urllib.error.HTTPError,RuntimeError,TypeError,KeyError) as error:
                      print('Route lookup unavailable:',field,type(error).__name__)
          try:
              tunnel=get('/cfd_tunnel/'+os.environ['CLOUDFLARE_TUNNEL_ID'])
              print('Tunnel status:',tunnel.get('status','unknown'),'connections:',len(tunnel.get('connections') or []))
          except (urllib.error.HTTPError,RuntimeError) as error:
              print('Tunnel status lookup unavailable:',type(error).__name__)
          try:
              request=urllib.request.Request('https://api.cloudflare.com/client/v4/zones?account.id='+account,headers={'Authorization':'Bearer '+token})
              with urllib.request.urlopen(request,timeout=25) as response: zone_data=json.load(response)
              if zone_data.get('success'):
                  print('Account zones:',[(zone.get('name'),zone.get('status')) for zone in zone_data.get('result',[])])
              else:
                  print('Zone list unavailable: API unsuccessful')
          except (urllib.error.HTTPError,RuntimeError) as error:
              print('Zone list unavailable:',type(error).__name__)
          PY
