name: TEREM Ornament v2 — Deploy Visualizer
on:
  push:
    branches: [main]
    paths: [".github/workflows/terem-ornament-v2-deploy.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      URL: https://terem-ornament-v2.kontrakevich.workers.dev
    steps:
      - uses: actions/checkout@v4
      - name: Verify secrets
        run: |
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$OPENROUTER_API_KEY"
      - name: Materialize Worker
        run: |
          rm -rf /tmp/terem-ornament-v2 && mkdir -p /tmp/terem-ornament-v2/src
          printf '%s' '' | base64 -d > /tmp/terem-ornament-v2/src/index.js
          printf '%s' 'eyJuYW1lIjoidGVyZW0tb3JuYW1lbnQtdjIiLCJtYWluIjoic3JjL2luZGV4LmpzIiwiY29tcGF0aWJpbGl0eV9kYXRlIjoiMjAyNi0xMC0wNCIsIndvcmtlcnNfZGV2Ijp0cnVlLCJvYnNlcnZhYmlsaXR5Ijp7ImVuYWJsZWQiOnRydWV9fQ==' | base64 -d > /tmp/terem-ornament-v2/wrangler.jsonc
      - name: Configure OpenRouter secret
        working-directory: /tmp/terem-ornament-v2
        run: printf '%s' "$OPENROUTER_API_KEY" | npx --yes wrangler@4 secret put OPENROUTER_API_KEY
      - name: Deploy
        working-directory: /tmp/terem-ornament-v2
        run: npx --yes wrangler@4 deploy
      - name: Enable workers.dev
        run: |
          API="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/terem-ornament-v2/subdomain"
          curl --fail --silent --show-error -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json" -X POST "$API" --data '{"enabled":true,"previews_enabled":false}' -o /tmp/subdomain.json
          python -c "import json;d=json.load(open('/tmp/subdomain.json'));assert d.get('success') is True"
      - name: Production gate
        run: |
          curl --fail --silent --show-error --retry 6 --retry-delay 2 "$URL/" -o /tmp/page.html
          grep -q "Референс → закон построения → генерация" /tmp/page.html
          grep -q "76.47%" /tmp/page.html
          curl --fail --silent --show-error "$URL/health" -o /tmp/health.json
          python -c "import json;d=json.load(open('/tmp/health.json'));assert d['ok'] and d['reference']=='TRM-0001'"
          echo "TEREM_REFERENCE_GRAMMAR_VISUALIZER_OK"
