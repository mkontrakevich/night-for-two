name: Cloudflare Deploy

on:
  push:
    branches: [main]
    paths:
      - "cloudflare/**"
      - ".github/workflows/cloudflare-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: night-for-two-cloudflare-production
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - name: Require Cloudflare deployment configuration
        env:
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_TUNNEL: ${{ secrets.CLOUDFLARE_TUNNEL_ID }}
          NIGHT_ORIGIN_HOST: ${{ secrets.NIGHT_ORIGIN_HOST }}
        shell: bash
        run: |
          missing=()
          [[ -n "$CF_ACCOUNT" ]] || missing+=(CLOUDFLARE_ACCOUNT_ID)
          [[ -n "$CF_TOKEN" ]] || missing+=(CLOUDFLARE_API_TOKEN)
          [[ -n "$CF_TUNNEL" ]] || missing+=(CLOUDFLARE_TUNNEL_ID)
          [[ -n "$NIGHT_ORIGIN_HOST" ]] || missing+=(NIGHT_ORIGIN_HOST)
          if (( ${#missing[@]} )); then
            printf '::error::Missing repository secrets/variable: %s\n' "${missing[*]}"
            exit 1
          fi

  deploy-gateway:
    needs: preflight
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudflare/night-gateway
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_TUNNEL_ID: ${{ secrets.CLOUDFLARE_TUNNEL_ID }}
      NIGHT_ORIGIN_HOST: ${{ secrets.NIGHT_ORIGIN_HOST }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Render account-specific Wrangler config
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          p=Path("wrangler.jsonc")
          cfg=json.loads(p.read_text())
          cfg["vars"]["NIGHT_ORIGIN_HOST"]=os.environ["NIGHT_ORIGIN_HOST"]
          cfg["vpc_networks"][0]["tunnel_id"]=os.environ["CLOUDFLARE_TUNNEL_ID"]
          Path("wrangler.deploy.json").write_text(json.dumps(cfg, indent=2)+"\n")
          PY
      - name: Deploy gateway Worker
        run: npx --yes wrangler@4 deploy --config wrangler.deploy.json

  verify:
    needs: deploy-gateway
    runs-on: ubuntu-latest
    env:
      NIGHT_PUBLIC_URL: https://night42.kontrakevich.workers.dev
    steps:
      - name: Verify production Reader and application health
        shell: bash
        run: |
          base="${NIGHT_PUBLIC_URL%/}"
          curl --fail --show-error --silent --retry 4 --retry-delay 3 -D /tmp/reader-headers -o /tmp/reader.html "$base/reader/"
          grep -qi '^x-night-product: reader' /tmp/reader-headers || { echo '::error::NIGHT_READER_ROUTE_NOT_READY'; exit 1; }
          curl --fail --show-error --silent --retry 4 --retry-delay 3 "$base/night/health" | tee /tmp/night-health.json
          curl --fail --show-error --silent --retry 4 --retry-delay 3 "$base/actions/health" | tee /tmp/actions-health.json
          python - <<'PY'
          import json
          d=json.load(open("/tmp/night-health.json"))
          if d.get("ok") is not True:
              raise SystemExit("NIGHT_HEALTH_NOT_OK")
          a=json.load(open("/tmp/actions-health.json"))
          if a.get("ok") is not True or a.get("product") != "night_actions":
              raise SystemExit("NIGHT_ACTIONS_HEALTH_NOT_OK")
          PY
