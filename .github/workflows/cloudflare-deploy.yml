name: Cloudflare Deploy

on:
  push:
    branches: [main]
    paths:
      - "cloudflare/**"
      - ".github/workflows/cloudflare-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: night-for-two-cloudflare-production
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    steps:
      - id: check
        env:
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_TUNNEL: ${{ secrets.CLOUDFLARE_TUNNEL_ID }}
          NIGHT_ORIGIN_HOST: ${{ secrets.NIGHT_ORIGIN_HOST }}
        shell: bash
        run: |
          if [[ -n "$CF_ACCOUNT" && -n "$CF_TOKEN" && -n "$CF_TUNNEL" && -n "$NIGHT_ORIGIN_HOST" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Cloudflare deployment is not configured yet. Required secrets: CLOUDFLARE_ACCOUNT_ID, CLOUDFLARE_API_TOKEN, CLOUDFLARE_TUNNEL_ID, NIGHT_ORIGIN_HOST."
          fi

  deploy-gateway:
    needs: preflight
    if: needs.preflight.outputs.configured == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudflare/night-gateway
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_TUNNEL_ID: ${{ secrets.CLOUDFLARE_TUNNEL_ID }}
      NIGHT_ORIGIN_HOST: ${{ secrets.NIGHT_ORIGIN_HOST }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Render account-specific Wrangler config
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          p=Path("wrangler.jsonc")
          cfg=json.loads(p.read_text())
          cfg["vars"]["NIGHT_ORIGIN_HOST"]=os.environ["NIGHT_ORIGIN_HOST"]
          cfg["vpc_networks"][0]["tunnel_id"]=os.environ["CLOUDFLARE_TUNNEL_ID"]
          Path("wrangler.deploy.json").write_text(json.dumps(cfg, indent=2)+"\n")
          PY
      - name: Deploy gateway Worker
        run: npx --yes wrangler@4 deploy --config wrangler.deploy.json

  verify:
    needs: deploy-gateway
    runs-on: ubuntu-latest
    env:
      NIGHT_PAGES_URL: ${{ vars.NIGHT_PAGES_URL }}
    steps:
      - name: Verify production health when public URL is configured
        shell: bash
        run: |
          if [[ -z "$NIGHT_PAGES_URL" ]]; then
            echo "::notice::NIGHT_PAGES_URL repository variable is not configured yet; gateway deployed, public Pages health check skipped."
            exit 0
          fi
          base="${NIGHT_PAGES_URL%/}"
          curl --fail --show-error --silent --retry 4 --retry-delay 3 "$base/night/health" | tee /tmp/night-health.json
          curl --fail --show-error --silent --retry 4 --retry-delay 3 "$base/actions/health" | tee /tmp/actions-health.json
          python - <<'PY'
          import json
          d=json.load(open("/tmp/night-health.json"))
          if d.get("ok") is not True:
              raise SystemExit("NIGHT_HEALTH_NOT_OK")
          a=json.load(open("/tmp/actions-health.json"))
          if a.get("ok") is not True or a.get("product") != "night_actions":
              raise SystemExit("NIGHT_ACTIONS_HEALTH_NOT_OK")
          PY
