name: TEREM Pattern Lab — Canary Deploy

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/terem-pattern-lab-canary.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify Cloudflare authorization
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_API_TOKEN"
      - name: Materialize canary
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/terem-pattern-lab
          mkdir -p /tmp/terem-pattern-lab/public /tmp/terem-pattern-lab/src
          printf '%s' '' | base64 -d > /tmp/terem-pattern-lab/public/index.html
          printf '%s' '' | base64 -d > /tmp/terem-pattern-lab/public/grammar.v1.json
          printf '%s' '' | base64 -d > /tmp/terem-pattern-lab/src/index.js
          printf '%s' '' | base64 -d > /tmp/terem-pattern-lab/wrangler.jsonc
      - name: Deploy canary
        working-directory: /tmp/terem-pattern-lab
        run: npx --yes wrangler@4 deploy
      - name: Verify canary
        shell: bash
        run: |
          set -euo pipefail
          URL="https://terem-pattern-lab.kontrakevich.workers.dev"
          REPORT="ops/terem-pattern-lab-canary-result.txt"
          mkdir -p ops
          : > "$REPORT"
          probe(){
            local path="$1" out="$2"
            local status
            status="$(curl --silent --show-error --location --max-time 30 --output "$out" --write-out '%{http_code}' "$URL$path" || true)"
            printf '%s=%s\n' "$path" "$status" | tee -a "$REPORT"
          }
          probe "/" /tmp/lab.html
          probe "/grammar.v1.json" /tmp/grammar.json
          probe "/library-index" /tmp/library.html
          probe "/source/assets/thumbs/0026-TRM-0031_PASSAGE_HALLS_wall_0_B.jpg" /tmp/source.jpg
          if grep -q "Pattern Laboratory" /tmp/lab.html 2>/dev/null; then echo "root_content=OK" | tee -a "$REPORT"; else echo "root_content=FAILED" | tee -a "$REPORT"; fi
          if python -c "import json; d=json.load(open('/tmp/grammar.json')); assert d['pipeline']==['SOURCE','DNA','RULES','GENERATE']" 2>/dev/null; then echo "grammar=OK" | tee -a "$REPORT"; else echo "grammar=FAILED" | tee -a "$REPORT"; fi
          if grep -q "TEREM Visual DNA" /tmp/library.html 2>/dev/null; then echo "library_index=OK" | tee -a "$REPORT"; else echo "library_index=FAILED" | tee -a "$REPORT"; fi
          if test -s /tmp/source.jpg; then echo "source_proxy=OK" | tee -a "$REPORT"; else echo "source_proxy=FAILED" | tee -a "$REPORT"; fi
          grep -q '^/=200
 "$REPORT"
          grep -q '^/grammar.v1.json=200
 "$REPORT"
          grep -q '^/library-index=200
 "$REPORT"
          grep -q '^/source/assets/thumbs/0026-TRM-0031_PASSAGE_HALLS_wall_0_B.jpg=200
 "$REPORT"
          grep -q '^root_content=OK
 "$REPORT"
          grep -q '^grammar=OK
 "$REPORT"
          grep -q '^library_index=OK
 "$REPORT"
          grep -q '^source_proxy=OK
 "$REPORT"
          echo "TEREM_PATTERN_LAB_CANARY_OK"

      - name: Persist canary diagnostics
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -f ops/terem-pattern-lab-canary-result.txt || exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ops/terem-pattern-lab-canary-result.txt
          git diff --cached --quiet && exit 0
          git commit -m "Record TEREM Pattern Lab canary diagnostics"
          git pull --rebase origin main
          git push origin HEAD:main
