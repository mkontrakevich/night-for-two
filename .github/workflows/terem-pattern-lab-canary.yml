name: TEREM Pattern Lab — Canary Deploy

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/terem-pattern-lab-canary.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify Cloudflare authorization
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_API_TOKEN"
      - name: Materialize canary
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/terem-pattern-lab
          mkdir -p /tmp/terem-pattern-lab/src /tmp/terem-pattern-lab/public/source/assets/thumbs
          printf '%s' '' | base64 -d > /tmp/terem-pattern-lab/src/index.js
          printf '%s' '' | base64 -d > /tmp/terem-pattern-lab/wrangler.jsonc
      - name: Mirror production DNA thumbnails
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://terem-visual-dna.kontrakevich.workers.dev"
          curl --fail --silent --show-error --retry 4 --retry-delay 2 "$BASE/" -o /tmp/terem-library.html
          grep -o 'src="assets/thumbs/[^"]*"' /tmp/terem-library.html | sed 's/^src="//;s/"$//' | sort -u > /tmp/terem-thumbs.txt
          count="$(wc -l < /tmp/terem-thumbs.txt | tr -d ' ')"
          echo "thumb_count=$count"
          test "$count" -ge 100
          export BASE
          cat /tmp/terem-thumbs.txt | xargs -P 8 -I{} sh -c '
            set -e
            p="$1"
            dest="/tmp/terem-pattern-lab/public/source/$p"
            mkdir -p "$(dirname "$dest")"
            curl --fail --silent --show-error --retry 4 --retry-delay 2 "$BASE/$p" -o "$dest"
          ' _ {}
          mirrored="$(find /tmp/terem-pattern-lab/public/source/assets/thumbs -type f | wc -l | tr -d ' ')"
          echo "mirrored_thumbs=$mirrored"
          test "$mirrored" -eq "$count"

      - name: Remove stale stable Worker
        shell: bash
        run: |
          set -euo pipefail
          API="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/terem-pattern-lab"
          status="$(curl --silent --show-error \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -X DELETE "$API" \
            -o /tmp/delete-stable.json \
            -w '%{http_code}' || true)"
          case "$status" in
            200|204|404) echo "stable_cleanup_http=$status" ;;
            *) cat /tmp/delete-stable.json; exit 1 ;;
          esac

      - name: Deploy canary
        working-directory: /tmp/terem-pattern-lab
        run: npx --yes wrangler@4 deploy
      - name: Enable workers.dev route
        shell: bash
        run: |
          set -euo pipefail
          API="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/terem-pattern-lab/subdomain"
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json" \
            -X POST "$API" \
            --data '{"enabled":true,"previews_enabled":false}' \
            -o /tmp/subdomain.json
          python -c "import json; d=json.load(open('/tmp/subdomain.json')); assert d.get('success') is True and (d.get('result') or {}).get('enabled') is True"
          sleep 3

      - name: Verify canary
        shell: bash
        run: |
          set -euo pipefail
          URL="https://terem-pattern-lab.kontrakevich.workers.dev"
          REPORT="ops/terem-pattern-lab-canary-result.txt"
          mkdir -p ops
          : > "$REPORT"
          probe(){
            local path="$1" out="$2"
            local status
            status="$(curl --silent --show-error --location --max-time 30 --output "$out" --write-out '%{http_code}' "$URL$path" || true)"
            printf '%s=%s\n' "$path" "$status" | tee -a "$REPORT"
          }
          probe "/" /tmp/lab.html
          probe "/health" /tmp/health.json
          probe "/grammar.v1.json" /tmp/grammar.json
          probe "/library-index" /tmp/library.html
          probe "/source/assets/thumbs/0026-TRM-0031_PASSAGE_HALLS_wall_0_B.jpg" /tmp/source.jpg
          grep -q "Pattern Laboratory" /tmp/lab.html && echo "root_content=OK" | tee -a "$REPORT" || echo "root_content=FAILED" | tee -a "$REPORT"
          python -c "import json; d=json.load(open('/tmp/health.json')); assert d['ok'] is True and d['product']=='terem-pattern-lab'" && echo "health=OK" | tee -a "$REPORT" || echo "health=FAILED" | tee -a "$REPORT"
          python -c "import json; d=json.load(open('/tmp/grammar.json')); assert d['pipeline']==['SOURCE','DNA','RULES','GENERATE']" && echo "grammar=OK" | tee -a "$REPORT" || echo "grammar=FAILED" | tee -a "$REPORT"
          grep -q "TEREM Visual DNA" /tmp/library.html && echo "library_index=OK" | tee -a "$REPORT" || echo "library_index=FAILED" | tee -a "$REPORT"
          test -s /tmp/source.jpg && echo "source_proxy=OK" | tee -a "$REPORT" || echo "source_proxy=FAILED" | tee -a "$REPORT"
          grep -Fxq "/=200" "$REPORT"
          grep -Fxq "/health=200" "$REPORT"
          grep -Fxq "/grammar.v1.json=200" "$REPORT"
          grep -Fxq "/library-index=200" "$REPORT"
          grep -Fxq "/source/assets/thumbs/0026-TRM-0031_PASSAGE_HALLS_wall_0_B.jpg=200" "$REPORT"
          grep -Fxq "root_content=OK" "$REPORT"
          grep -Fxq "health=OK" "$REPORT"
          grep -Fxq "grammar=OK" "$REPORT"
          grep -Fxq "library_index=OK" "$REPORT"
          grep -Fxq "source_proxy=OK" "$REPORT"
          echo "TEREM_PATTERN_LAB_CANARY_OK"
      - name: Remove superseded v2 Worker
        shell: bash
        run: |
          set -euo pipefail
          API="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/terem-pattern-lab-v2"
          status="$(curl --silent --show-error \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -X DELETE "$API" \
            -o /tmp/delete-v2.json \
            -w '%{http_code}' || true)"
          case "$status" in
            200|204|404) echo "v2_cleanup_http=$status" ;;
            *) cat /tmp/delete-v2.json; exit 1 ;;
          esac

      - name: Persist canary diagnostics
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -f ops/terem-pattern-lab-canary-result.txt || exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ops/terem-pattern-lab-canary-result.txt
          git diff --cached --quiet && exit 0
          git commit -m "Record TEREM Pattern Lab canary diagnostics"
          git pull --rebase origin main
          git push origin HEAD:main
